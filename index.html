<title>可可创作台 · 自媒体Daily</title>
<style>
:root {
  --pink-50:#FFF5F7; --pink-100:#FFE4EC; --pink-200:#FFC4D9; --pink-300:#FFA8C5;
  --pink-400:#FF8AB5; --pink-500:#F472B6; --pink-600:#EC4899;
  --purple-100:#EDE4FF; --purple-300:#C9A0E8; --purple-500:#9333EA;
  --cream:#FFF8F3; --peach:#FFE0D0; --apricot:#FFD9C0;
  --text:#4A3B4F; --text-sub:#8B7A8F; --text-mute:#B5A8B8;
  --card:#FFFFFF; --border:#F5E8F0;
  --shadow:0 4px 16px rgba(244,114,182,0.08);
  --shadow-md:0 8px 24px rgba(244,114,182,0.12);
  --radius:18px; --radius-sm:12px; --radius-lg:24px;
  --sidebar-w:200px;
  --sidebar-grad:linear-gradient(180deg,#FFB6D1 0%,#E8A0D5 50%,#C9A0E8 100%);
  --bg-grad:linear-gradient(160deg,#FFF5F0 0%,#FFE9F0 40%,#F5E8FF 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-grad);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
#app{display:flex;height:100dvh;max-width:1100px;margin:0 auto;position:relative;overflow:hidden;}

/* === Sidebar === */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-grad);display:flex;flex-direction:column;z-index:10;transition:transform .3s;}
.sidebar-brand{padding:20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.2);}
.brand-emoji{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:22px;}
.brand-name{font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.1);}
.brand-sub{font-size:10px;color:rgba(255,255,255,.8);margin-top:1px;}
.sidebar-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.sidebar-nav::-webkit-scrollbar{width:0;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#fff;text-decoration:none;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap;opacity:.85;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.15);opacity:1;}
.nav-item.active{background:rgba(255,255,255,.95);color:var(--pink-600);font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.1);opacity:1;}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.2);}
.mode-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:11px;cursor:pointer;font-family:inherit;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9;}

/* === Main === */
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(255,255,255,.6);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:5;}
.menu-btn{display:none;width:36px;height:36px;border:none;background:transparent;color:var(--text);cursor:pointer;border-radius:10px;align-items:center;justify-content:center;}
.topbar-greeting{display:flex;align-items:center;gap:10px;}
.greeting-avatar{width:36px;height:36px;border-radius:50%;background:var(--pink-100);display:flex;align-items:center;justify-content:center;font-size:18px;}
.greeting-text{font-size:15px;font-weight:600;color:var(--text);}
.greeting-sub{font-size:11px;color:var(--text-sub);}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:10px;}
.sync-local{background:#FFF3E0;color:#E65100;}
.sync-cloud{background:#E8F5EE;color:#2E7D32;}
.icon-btn{width:34px;height:34px;border-radius:10px;border:none;background:var(--pink-100);color:var(--pink-500);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--pink-200);border-radius:4px;}
.view{animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* === Home === */
.page-title{font-size:22px;font-weight:700;letter-spacing:.3px;}
.page-subtitle{font-size:13px;color:var(--text-sub);margin-top:2px;margin-bottom:16px;}
.hero-time{background:var(--card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden;}
.hero-time::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--pink-100);opacity:.5;}
.hero-time::after{content:'';position:absolute;bottom:-30px;left:-10px;width:60px;height:60px;border-radius:50%;background:var(--purple-100);opacity:.4;}
.hero-time .ht-time{font-size:38px;font-weight:700;background:linear-gradient(135deg,var(--pink-500),var(--purple-500));-webkit-background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:1;}
.hero-time .ht-date{font-size:13px;color:var(--text-sub);margin-top:4px;position:relative;z-index:1;}
.hero-time .ht-quote{font-size:13px;color:var(--text);margin-top:10px;font-style:italic;position:relative;z-index:1;}
.hero-deco{position:absolute;font-size:20px;z-index:1;}
.checkin-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.checkin-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.checkin-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}
.streak-badge{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;}
.checkin-body{display:flex;gap:18px;align-items:center;}
.ring-wrap{position:relative;width:90px;height:90px;flex-shrink:0;}
.ring-svg{transform:rotate(-90deg);}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-pct{font-size:18px;font-weight:700;color:var(--pink-500);}
.ring-label{font-size:10px;color:var(--text-mute);}
.checkin-list{flex:1;display:flex;flex-direction:column;gap:8px;}
.checkin-item{display:flex;align-items:center;gap:8px;font-size:13px;}
.checkin-item .ci-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--pink-200);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.checkin-item .ci-box.done{background:var(--pink-400);border-color:var(--pink-400);}
.checkin-item .ci-box svg{display:none;width:12px;height:12px;color:#fff;}
.checkin-item .ci-box.done svg{display:block;}
.quote-card{background:linear-gradient(135deg,var(--pink-100),var(--purple-100));border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.quote-card .qc-icon{font-size:20px;margin-bottom:8px;}
.quote-card .qc-en{font-size:13px;color:var(--purple-500);font-style:italic;margin-bottom:4px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .2s;}
.stat-card:active{transform:scale(.97);}

.stat-icon.pink{background:#FFE4EC;} .stat-icon.purple{background:#EDE4FF;} .stat-icon.peach{background:#FFE0D0;} .stat-icon.blue{background:#E4EEFF;}
.stat-val{font-size:20px;font-weight:700;} .stat-label{font-size:11px;color:var(--text-mute);}

/* === Task === */
.quadrant{margin-bottom:14px;}

.q1-h{background:#FFEBEE;color:#E53935;} .q2-h{background:#E8F5EE;color:#43A047;} .q3-h{background:#FFF8E1;color:#FB8C00;} .q4-h{background:#F3F4F6;color:#9CA3AF;}
.task-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadow);animation:fadeUp .25s;}
.task-item.done{opacity:.5;} .task-item.done .task-text{text-decoration:line-through;}
.checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink-200);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}

/* === Card === */

esc(s){if(!s)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));},
dateLabel(){const d=new Date();const w=['\u5468\u65e5','\u5468\u4e00','\u5468\u4e8c','\u5468\u4e09','\u5468\u56db','\u5468\u4e94','\u5468\u516d'][d.getDay()];return(d.getMonth()+1)+'\u6708'+d.getDate()+'\u65e5 \u00b7 '+w;},
greet(){const h=new Date().getHours();if(h<6)return'\u6df1\u591c\u597d';if(h<12)return'\u65e9\u4e0a\u597d';if(h<18)return'\u4e0b\u5348\u597d';return'\u665a\u4e0a\u597d';}

plan(d){

return `<div class="view"><div class="page-title">\u6bcf\u65e5\u8ba1\u5212</div><div class="page-subtitle">\u56db\u8c61\u9650\u6cd5\u7ba1\u7406\u521b\u4f5c\u4efb\u52a1</div>

vCard(v,type){const isHot=type==='hot';
return `<div class="card video-card"><div class="video-thumb"><span style="font-size:44px;">${v.thumb||'\uD83C\uDF99'}</span><div class="platform-badge"><span class="tag tag-platform ${U.plat(v.platform)}">${v.platform}</span></div><div class="hot-score">\ud83d\udd25 ${v.plays}</div><div class="play-btn" onclick="window.open('${v.url}','_blank')"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#F472B6" d="M8 5v14l11-7z"/></svg></div></div><div class="video-body"><div class="video-title">${U.esc(v.title)}</div><div class="video-meta"><span>\ud83d\udc64 ${U.esc(v.author||'\u533f\u540d')}</span><span>\u2764 ${v.likes}</span>${v.plays?`<span>\u25b6 ${v.plays}</span>`:''}</div>
${isHot?`<div class="analysis-block"><div class="ab-title edit">\ud83c\udfaf \u9002\u914d\u7406\u7531</div><p>${U.esc(v.fitReason)}</p></div><div class="analysis-block"><div class="ab-title idea">\ud83d\udca1 \u4e8c\u521b\u6539\u7f16\u65b9\u6848</div><p>${U.esc(v.plan)}</p></div>`:`<div class="analysis-block"><div class="ab-title fire">\ud83d\udd25 \u7206\u6b3e\u6838\u5fc3\u539f\u56e0</div><p>${U.esc(v.hotReason)}</p></div><div class="analysis-block"><div class="ab-title idea">\ud83d\udca1 \u4f60\u7684\u539f\u521b\u601d\u8def</div><p>${U.esc(v.idea)}</p></div>`}
<div class="video-actions"><a class="btn btn-primary btn-sm" href="${v.url}" target="_blank" style="text-decoration:none;">\u25b6 \u67e5\u770b\u539f\u89c6\u9891</a><button class="btn btn-ghost btn-sm" onclick="App.saveLib('${v.id}','${type}')">\u6536\u5165\u9009\u9898\u5e93</button></div></div></div>`;
},

empty(t,tip){return `<div class="empty-state"><svg viewBox="0 0 24 24" width="56" height="56" style="opacity:.4;"><path fill="#B5A8B8" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><p>${t}</p><div style="font-size:12px;margin-top:4px;">${tip}</div></div>`;}
};

const NAV=[
{key:'home',icon:'\uD83C\uDFE0',label:'\u9996\u9875'},{key:'plan',icon:'\u2705',label:'\u6bcf\u65e5\u8ba1\u5212'},{key:'books',icon:'\uD83D\uDCDA',label:'\u6bcf\u65e5\u9605\u8bfb'},{key:'inspire',icon:'\uD83D\uDCA1',label:'\u9009\u9898\u7075\u611f'},{key:'hot',icon:'\uD83D\uDD25',label:'\u70ed\u70b9\u4e8c\u521b'},{key:'library',icon:'\uD83D\uDCD5',label:'\u7206\u6b3e\u9009\u9898'},{key:'review',icon:'\uD83D\uDCDD',label:'\u5185\u5bb9\u590d\u76d8'},{key:'edit',icon:'\u2702\ufe0f',label:'\u89c6\u9891\u526a\u8f91'},{key:'finance',icon:'\uD83D\uDCB0',label:'\u7406\u8d22\u77e5\u8bc6'}
];

const App={data:null,view:'home',platform:'dy',
init(){this.data=DB.load();this.data=DB.checkReset(this.data);DB.save(this.data);this.renderNav();this.updateHeader();this.render();this.startClock();},
renderNav(){document.getElementById('sidebarNav').innerHTML=NAV.map(n=>`<a class="nav-item ${this.view===n.key?'active':''}" data-view="${n.key}" onclick="App.nav('${n.key}')"><span style="font-size:18px;">${n.icon}</span><span>${n.label}</span></a>`).join('');},
nav(v){this.view=v;document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));this.render();if(window.innerWidth<=768)this.closeSidebar();document.getElementById('viewContainer').scrollTop=0;},
toggleSidebar(){const s=document.getElementById('sidebar');const o=document.getElementById('sidebarOverlay');s.classList.toggle('open');o.classList.toggle('show');},
closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show');},
updateHeader(){document.getElementById('todayLabel').textContent=U.dateLabel();document.getElementById('modeLabel').textContent=this.data.mode==='daily'?'\u6bcf\u65e5\u91cd\u7f6e':'\u7d2f\u79ef\u8bb0\u5f55';},
startClock(){const upd=()=>{const d=new Date();const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const el=document.getElementById('liveTime');if(el)el.textContent=t;};upd();setInterval(upd,1000);},
render(){const c=document.getElementById('viewContainer');const d=this.data;const v=this.view;c.innerHTML=v==='home'?V.home(d):v==='plan'?V.plan(d):v==='books'?V.books(d):v==='inspire'?V.inspire(d):v==='hot'?V.hot(d):v==='library'?V.library(d):v==='review'?V.review(d):v==='edit'?V.edit(d):v==='finance'?V.finance(d):'';},
toggleCheckin(k){this.data.checkin[k]=!this.data.checkin[k];DB.save(this.data);this.render();},
addTask(q){const i=document.getElementById('ai-'+q);const t=i.value.trim();if(!t)return;this.data.tasks[q].push({id:U.uid(),text:t,done:false});DB.save(this.data);this.render();U.toast('\u5df2\u65b0\u589e');},
delTask(q,id){this.data.tasks[q]=this.data.tasks[q].filter(t=>t.id!==id);DB.save(this.data);this.render();U.toast('\u5df2\u5220\u9664');},
toggleTask(q,id){const t=this.data.tasks[q].find(x=>x.id===id);if(t){t.done=!t.done;DB.save(this.data);this.render();if(t.done)U.toast('\u6253\u5361\u5b8c\u6210 \u2705');}},
toggleQ(q){const b=document.getElementById('qb-'+q);b.style.display=b.style.display==='none'?'':'none';},
switchP(p){this.platform=p;this.render();},
saveLib(id,type){const list=type==='hot'?this.data.hot:(this.data.inspire[this.platform]||[]);const v=list.find(x=>x.id===id);if(!v)return;if(this.data.library.some(l=>l.title===v.title)){U.toast('\u5df2\u5b58\u5728');return;}const kw=v.title.slice(0,8).split(/[，,、\s]/).filter(Boolean).slice(0,3);this.data.library.unshift({id:U.uid(),title:v.title,keywords:kw.length?kw:['\u6570\u7801','\u5f00\u7bb1'],url:v.url,platform:v.platform,plays:v.plays});DB.save(this.data);U.toast('\u5df2\u6536\u5165\u9009\u9898\u5e93');},
searchLib(kw){kw=kw.trim().toLowerCase();document.querySelectorAll('#libTbody tr').forEach(tr=>tr.style.display=tr.dataset.kw.includes(kw)?'':'none');},
openAddLib(){const h='<div class="form-row"><label class="label">\u6807\u9898</label><input class="input" id="nl-t" placeholder="\u7206\u6b3e\u89c6\u9891\u6807\u9898"></div><div class="form-row"><label class="label">\u5173\u952e\u8bcd</label><input class="input" id="nl-k" placeholder="\u7528\u9017\u53f7\u5206\u9694"></div><div class="form-row"><label class="label">\u5e73\u53f0</label><select class="select" id="nl-p"><option>\u6296\u97f3</option><option>B\u7ad9</option><option>\u5c0f\u7ea2\u4e66</option><option>\u5fae\u535a</option></select></div><div class="form-row"><label class="label">\u94fe\u63a5</label><input class="input" id="nl-u" placeholder="https://"></div><button class="btn btn-primary btn-full" onclick="App.subLib()">\u4fdd\u5b58</button>';this.modal('\u65b0\u589e\u9009\u9898',h);},
subLib(){const t=document.getElementById('nl-t').value.trim();const k=document.getElementById('nl-k').value.trim();const p=document.getElementById('nl-p').value;const u=document.getElementById('nl-u').value.trim()||'#';if(!t){U.toast('\u8bf7\u8f93\u5165\u6807\u9898');return;}this.data.library.unshift({id:U.uid(),title:t,keywords:k?k.split(/[，,、\s]/).filter(Boolean):['\u6570\u7801'],url:u,platform:p});DB.save(this.data);this.closeModal();this.render();U.toast('\u5df2\u65b0\u589e');},
openReview(){const h='<div class="form-row"><label class="label">\u4f5c\u54c1\u6807\u9898</label><input class="input" id="rv-t" placeholder="\u5982\uff1a\u767e\u5143\u6570\u636e\u7ebf\u5f00\u7bb1\u5b9e\u6d4b"></div><div class="metric-grid"><div class="metric-input"><label>\u64ad\u653e\u91cf</label><input type="number" id="rv-p"><span style="font-size:11px;color:var(--text-mute);">\u6b21</span></div><div class="metric-input"><label>\u70b9\u8d5e</label><input type="number" id="rv-l"><span style="font-size:11px;color:var(--text-mute);">\u4e2a</span></div><div class="metric-input"><label>\u8bc4\u8bba</label><input type="number" id="rv-c"><span style="font-size:11px;color:var(--text-mute);">\u6761</span></div><div class="metric-input"><label>\u6536\u85cf</label><input type="number" id="rv-s"><span style="font-size:11px;color:var(--text-mute);">\u4e2a</span></div><div class="metric-input"><label>\u8f6c\u53d1</label><input type="number" id="rv-sh"><span style="font-size:11px;color:var(--text-mute);">\u6b21</span></div><div class="metric-input"><label>\u5b8c\u64ad\u7387</label><input type="number" id="rv-f"><span style="font-size:11px;color:var(--text-mute);">%</span></div></div><div class="form-row" style="margin-top:14px;"><label class="label">\u6d41\u91cf\u6765\u6e90</label><input class="input" id="rv-tr" placeholder="\u5982\uff1a\u63a8\u835070%/\u5173\u6ce815%/\u641c\u7d2215%"></div><button class="btn btn-primary btn-full mt-12" onclick="App.subReview()">\u667a\u80fd\u8bca\u65ad\u5e76\u4fdd\u5b58</button>';this.modal('\u5f55\u5165\u590d\u76d8',h);},
subReview(){const t=document.getElementById('rv-t').value.trim();const p=+document.getElementById('rv-p').value||0;const l=+document.getElementById('rv-l').value||0;const c=+document.getElementById('rv-c').value||0;const s=+document.getElementById('rv-s').value||0;const sh=+document.getElementById('rv-sh').value||0;const f=+document.getElementById('rv-f').value||0;const tr=document.getElementById('rv-tr').value.trim()||'\u672a\u586b\u5199';if(!t||!p){U.toast('\u8bf7\u586b\u6807\u9898\u548c\u64ad\u653e\u91cf');return;}const diag=this.diag({plays:p,likes:l,comments:c,saves:s,shares:sh,finishRate:f,traffic:tr});this.data.reviews.unshift({id:U.uid(),date:new Date().toISOString().slice(0,10),title:t,plays:p,likes:l,comments:c,saves:s,shares:sh,finishRate:f,traffic:tr,diag:diag});DB.save(this.data);this.closeModal();this.render();U.toast('\u590d\u76d8\u5df2\u5b58\u6863');},
diag(m){const d=[];const lr=m.plays?m.likes/m.plays*100:0;const cr=m.plays?m.comments/m.plays*100:0;const sr=m.plays?m.saves/m.plays*100:0;const shr=m.plays?m.shares/m.plays*100:0;
if(m.finishRate<30)d.push({level:'bad',head:'\u5b8c\u64ad\u7387\u4e25\u91cd\u504f\u4f4e\uff08'+m.finishRate+'%\uff09',body:'\u8fdc\u4f4e\u4e8e30%\u53ca\u683c\u7ebf',action:'\u524d3\u79d2\u5fc5\u987b\u524d\u7f6e\u94a9\u5b50\uff0c\u7528\u8fd9\u73a9\u610f\u513f\u5c45\u7136\u80fd\u53cd\u5e38\u8bc6\u5f00\u573a\uff1b\u6bcf15\u79d2\u8bbe\u4e00\u4e2a\u4fe1\u606f\u951a\u70b9'});
else if(m.finishRate<45)d.push({level:'bad',head:'\u5b8c\u64ad\u7387\u504f\u4f4e\uff08'+m.finishRate+'%\uff09',body:'\u4f4e\u4e8e\u8d5b\u9053\u5747\u503c45%',action:'\u4f18\u5316\u524d3\u79d2\u524d\u7f6e\u94a9\u5b50\uff0c\u5220\u51cf\u5197\u4f59\u5f00\u573a\u767d'});
else d.push({level:'good',head:'\u5b8c\u64ad\u7387\u826f\u597d\uff08'+m.finishRate+'%\uff09',body:'\u8fbe\u5230\u7206\u6b3e\u5b8c\u64ad\u6807\u51c6',action:'\u4fdd\u7559\u5f53\u524d\u5f00\u573a\u7ed3\u6784\uff0c\u53ef\u590d\u7528\u5230\u540c\u7cfb\u5217'});
if(lr<3)d.push({level:'bad',head:'\u70b9\u8d5e\u7387\u504f\u4f4e\uff08'+lr.toFixed(1)+'%\uff09',body:'\u4f4e\u4e8e\u7206\u6b3e5%\u9608\u503c',action:'\u5f3a\u5316\u60c5\u7eea\u5171\u9e23\u70b9\uff1b\u7ed3\u5c3e\u52a0\u89c9\u5f97\u6709\u7528\u70b9\u4e2a\u8d5e\u8f7b\u5f15\u5bfc'});
else d.push({level:'good',head:'\u70b9\u8d5e\u7387\u8fbe\u6807\uff08'+lr.toFixed(1)+'%\uff09',body:'\u5185\u5bb9\u89e6\u8fbe\u6548\u679c\u597d',action:'\u7ee7\u7eed\u5f3a\u5316\u60c5\u7eea\u5171\u9e23\u70b9'});
if(cr<0.3)d.push({level:'bad',head:'\u8bc4\u8bba\u4e92\u52a8\u5c11\uff08'+cr.toFixed(2)+'%\uff09',body:'\u4e92\u52a8\u7387\u4f4e\u4e8e0.5%',action:'\u7ed3\u5c3e\u629b\u51fa\u4e92\u52a8\u6027\u95ee\u9898\uff1a\u4f60\u88ab\u54ea\u4e2a\u6570\u7801\u4ea7\u54c1\u5751\u8fc7\uff1f\u8bc4\u8bba\u533a\u5410\u69fd'});
else d.push({level:'good',head:'\u4e92\u52a8\u8868\u73b0\u826f\u597d\uff08'+cr.toFixed(2)+'%\uff09',body:'\u8bdd\u9898\u5f15\u53d1\u8ba8\u8bba',action:'\u7cbe\u9009\u70ed\u8bc4\u7f6e\u9876\uff0c\u53ef\u505a\u8bc4\u8bba\u533a\u795e\u56de\u590d\u7cfb\u5217'});
if(sr<1)d.push({level:'bad',head:'\u6536\u85cf\u7387\u504f\u4f4e\uff08'+sr.toFixed(1)+'%\uff09',body:'\u5b9e\u7528\u6027\u611f\u77e5\u4e0d\u8db3',action:'\u589e\u52a0\u5e72\u8d27\u6e05\u5355/\u907f\u5751\u8868\u7b49\u53ef\u6536\u85cf\u4fe1\u606f\u5757\uff1b\u6807\u9898\u5f3a\u5316\u6536\u85cf\u8bcd'});
else d.push({level:'good',head:'\u6536\u85cf\u7387\u9ad8\uff08'+sr.toFixed(1)+'%\uff09',body:'\u5b9e\u7528\u4ef7\u503c\u7a81\u51fa',action:'\u53ef\u505a\u7cfb\u5217\u5316\u56fa\u5b9a\u680f\u76ee'});
if(shr<0.5)d.push({level:'bad',head:'\u8f6c\u53d1\u7387\u4f4e\uff08'+shr.toFixed(2)+'%\uff09',body:'\u793e\u4ea4\u8d27\u5e01\u5c5e\u6027\u5f31',action:'\u589e\u52a0\u827e\u7279\u670b\u53cb\u770b\u578b\u793e\u4ea4\u94a9\u5b50'});
return d;},
openAddEdit(){const h='<div class="form-row"><label class="label">\u9879\u76ee\u540d\u79f0</label><input class="input" id="ed-t" placeholder="\u5982\uff1aiPhone\u5f00\u7bb1\u4e3b\u89c6\u9891"></div><div class="form-row"><label class="label">\u622a\u6b62\u65e5\u671f</label><input class="input" id="ed-d" placeholder="\u5982\uff1a7\u670831\u65e5"></div><button class="btn btn-primary btn-full" onclick="App.subEdit()">\u4fdd\u5b58</button>';this.modal('\u65b0\u589e\u526a\u8f91\u9879\u76ee',h);},
subEdit(){const t=document.getElementById('ed-t').value.trim();const dl=document.getElementById('ed-d').value.trim();if(!t){U.toast('\u8bf7\u8f93\u5165\u540d\u79f0');return;}this.data.editProjects.push({id:U.uid(),title:t,status:'\u5f85\u526a\u8f91',progress:0,tasks:'0/0',deadline:dl});DB.save(this.data);this.closeModal();this.render();U.toast('\u5df2\u65b0\u589e');},
openModeModal(){const h='<div class="mode-switch"><button class="'+(this.data.mode==='daily'?'active':'')+'" onclick="App.setMode(\'daily\')">\u6bcf\u65e5\u91cd\u7f6e</button><button class="'+(this.data.mode==='accumulate'?'active':'')+'" onclick="App.setMode(\'accumulate\')">\u7d2f\u79ef\u8bb0\u5f55</button></div><div class="text-mute" style="margin-bottom:14px;line-height:1.7;"><b>\u6bcf\u65e5\u91cd\u7f6e\uff1a</b>\u6bcf\u5929 0:00 \u81ea\u52a8\u53d6\u6d88\u4efb\u52a1\u52fe\u9009<br><b>\u7d2f\u79ef\u8bb0\u5f55\uff1a</b>\u52fe\u9009\u72b6\u6001\u6301\u7eed\u4fdd\u7559</div>';this.modal('\u6253\u5361\u6a21\u5f0f',h);},
setMode(m){this.data.mode=m;DB.save(this.data);this.updateHeader();document.querySelectorAll('.mode-switch button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');U.toast(m==='daily'?'\u5df2\u5207\u6362\u6bcf\u65e5\u91cd\u7f6e':'\u5df2\u5207\u6362\u7d2f\u79ef\u8bb0\u5f55');},
modal(title,html){const m=document.createElement('div');m.className='modal-mask';m.id='modalMask';m.innerHTML='<div class="modal-sheet"><div class="modal-title">'+title+'</div>'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)this.closeModal();});document.body.appendChild(m);},
closeModal(){const m=document.getElementById('modalMask');if(m)m.remove();}
};
document.addEventListener('DOMContentLoaded',()=>App.init());

</script>
