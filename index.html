<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F8C8DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="可可创作台">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>可可创作台 · 自媒体Daily</title>
<style>
:root {
  --pink-50:#FFF5F7; --pink-100:#FFE4EC; --pink-200:#FFC4D9; --pink-300:#FFA8C5;
  --pink-400:#FF8AB5; --pink-500:#F472B6; --pink-600:#EC4899;
  --purple-100:#EDE4FF; --purple-300:#C9A0E8; --purple-500:#9333EA;
  --cream:#FFF8F3; --peach:#FFE0D0; --apricot:#FFD9C0;
  --text:#4A3B4F; --text-sub:#8B7A8F; --text-mute:#B5A8B8;
  --card:#FFFFFF; --border:#F5E8F0;
  --shadow:0 4px 16px rgba(244,114,182,0.08);
  --shadow-md:0 8px 24px rgba(244,114,182,0.12);
  --radius:18px; --radius-sm:12px; --radius-lg:24px;
  --sidebar-w:200px;
  --sidebar-grad:linear-gradient(180deg,#FFB6D1 0%,#E8A0D5 50%,#C9A0E8 100%);
  --bg-grad:linear-gradient(160deg,#FFF5F0 0%,#FFE9F0 40%,#F5E8FF 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-grad);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
#app{display:flex;height:100dvh;max-width:1100px;margin:0 auto;position:relative;overflow:hidden;}

/* === Sidebar === */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-grad);display:flex;flex-direction:column;z-index:10;transition:transform .3s;}
.sidebar-brand{padding:20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.2);}
.brand-emoji{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:22px;}
.brand-name{font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.1);}
.brand-sub{font-size:10px;color:rgba(255,255,255,.8);margin-top:1px;}
.sidebar-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.sidebar-nav::-webkit-scrollbar{width:0;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#fff;text-decoration:none;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap;opacity:.85;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.15);opacity:1;}
.nav-item.active{background:rgba(255,255,255,.95);color:var(--pink-600);font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.1);opacity:1;}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.2);}
.mode-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:11px;cursor:pointer;font-family:inherit;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9;}

/* === Main === */
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(255,255,255,.6);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:5;}
.menu-btn{display:none;width:36px;height:36px;border:none;background:transparent;color:var(--text);cursor:pointer;border-radius:10px;align-items:center;justify-content:center;}
.topbar-greeting{display:flex;align-items:center;gap:10px;}
.greeting-avatar{width:36px;height:36px;border-radius:50%;background:var(--pink-100);display:flex;align-items:center;justify-content:center;font-size:18px;}
.greeting-text{font-size:15px;font-weight:600;color:var(--text);}
.greeting-sub{font-size:11px;color:var(--text-sub);}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:10px;}
.sync-local{background:#FFF3E0;color:#E65100;}
.sync-cloud{background:#E8F5EE;color:#2E7D32;}
.icon-btn{width:34px;height:34px;border-radius:10px;border:none;background:var(--pink-100);color:var(--pink-500);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--pink-200);border-radius:4px;}
.view{animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* === Home === */
.page-title{font-size:22px;font-weight:700;letter-spacing:.3px;}
.page-subtitle{font-size:13px;color:var(--text-sub);margin-top:2px;margin-bottom:16px;}
.hero-time{background:var(--card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden;}
.hero-time::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--pink-100);opacity:.5;}
.hero-time::after{content:'';position:absolute;bottom:-30px;left:-10px;width:60px;height:60px;border-radius:50%;background:var(--purple-100);opacity:.4;}
.hero-time .ht-time{font-size:38px;font-weight:700;background:linear-gradient(135deg,var(--pink-500),var(--purple-500));-webkit-background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:1;}
.hero-time .ht-date{font-size:13px;color:var(--text-sub);margin-top:4px;position:relative;z-index:1;}
.hero-time .ht-quote{font-size:13px;color:var(--text);margin-top:10px;font-style:italic;position:relative;z-index:1;}
.hero-deco{position:absolute;font-size:20px;z-index:1;}
.checkin-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.checkin-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.checkin-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}
.streak-badge{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;}
.checkin-body{display:flex;gap:18px;align-items:center;}
.ring-wrap{position:relative;width:90px;height:90px;flex-shrink:0;}
.ring-svg{transform:rotate(-90deg);}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-pct{font-size:18px;font-weight:700;color:var(--pink-500);}
.ring-label{font-size:10px;color:var(--text-mute);}
.checkin-list{flex:1;display:flex;flex-direction:column;gap:8px;}
.checkin-item{display:flex;align-items:center;gap:8px;font-size:13px;}
.checkin-item .ci-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--pink-200);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.checkin-item .ci-box.done{background:var(--pink-400);border-color:var(--pink-400);}
.checkin-item .ci-box svg{display:none;width:12px;height:12px;color:#fff;}
.checkin-item .ci-box.done svg{display:block;}
.quote-card{background:linear-gradient(135deg,var(--pink-100),var(--purple-100));border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.quote-card .qc-icon{font-size:20px;margin-bottom:8px;}
.quote-card .qc-en{font-size:13px;color:var(--purple-500);font-style:italic;margin-bottom:4px;}
.quote-card .qc-cn{font-size:14px;color:var(--text);font-weight:500;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .2s;}
.stat-card:active{transform:scale(.97);}
.stat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-icon.pink{background:#FFE4EC;} .stat-icon.purple{background:#EDE4FF;} .stat-icon.peach{background:#FFE0D0;} .stat-icon.blue{background:#E4EEFF;}
.stat-val{font-size:20px;font-weight:700;} .stat-label{font-size:11px;color:var(--text-mute);}

/* === Task === */
.quadrant{margin-bottom:14px;}
.quadrant-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;}
.q-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;} .q-stat{font-size:11px;color:var(--text-mute);}
.q1-h{background:#FFEBEE;color:#E53935;} .q2-h{background:#E8F5EE;color:#43A047;} .q3-h{background:#FFF8E1;color:#FB8C00;} .q4-h{background:#F3F4F6;color:#9CA3AF;}
.task-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadow);animation:fadeUp .25s;}
.task-item.done{opacity:.5;} .task-item.done .task-text{text-decoration:line-through;}
.checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink-200);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.checkbox.checked{background:var(--pink-400);border-color:var(--pink-400);} .checkbox.checked svg{display:block;}
.checkbox svg{display:none;width:12px;height:12px;color:#fff;}
.task-text{flex:1;font-size:14px;word-break:break-all;}
.task-del{width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:var(--text-mute);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;}
.task-item:active .task-del{opacity:1;}
.add-task-row{display:flex;gap:8px;margin-top:8px;}
.completed-fold{margin:14px 0 8px;border-radius:var(--radius-sm);overflow:hidden;}
.completed-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pink-100);cursor:pointer;font-size:13px;font-weight:600;color:var(--pink-600);}
.completed-body{padding:8px;display:none;}
.completed-fold.open .completed-body{display:block;}

/* === Card === */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.progress-bar{height:8px;background:var(--pink-100);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink-400),var(--purple-500));border-radius:8px;transition:width .4s;width:0;}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub);margin-top:6px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;}
.btn-ghost{background:var(--pink-100);color:var(--pink-600);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-sub);}
.btn-full{width:100%;} .btn-sm{padding:6px 11px;font-size:12px;} .btn-xs{padding:3px 8px;font-size:11px;border-radius:6px;}
.input,.textarea,.select{width:100%;padding:10px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--cream);font-size:14px;font-family:inherit;color:var(--text);}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--pink-300);}
.textarea{resize:none;min-height:70px;}
.label{font-size:12px;color:var(--text-sub);margin-bottom:6px;display:block;font-weight:500;}
.form-row{margin-bottom:14px;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;background:var(--pink-100);color:var(--pink-600);}
.tag-platform.dy{background:#FFE9EC;color:#FF3B5C;} .tag-platform.bz{background:#FFE9F0;color:#FB7299;} .tag-platform.xhs{background:#FFE9EC;color:#FF2442;}

/* === Video Card === */
.video-card{padding:0;overflow:hidden;}
.video-thumb{position:relative;height:170px;background:linear-gradient(135deg,var(--pink-100),var(--purple-100));display:flex;align-items:center;justify-content:center;}
.play-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer;}
.platform-badge{position:absolute;top:10px;left:10px;} .hot-score{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;padding:3px 8px;border-radius:20px;font-size:11px;}
.video-body{padding:14px;}
.video-title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:8px;}
.video-meta{display:flex;gap:12px;font-size:12px;color:var(--text-mute);margin-bottom:12px;flex-wrap:wrap;}
.analysis-block{background:var(--cream);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
.ab-title{font-size:12px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.ab-title.fire{color:#E53935;} .ab-title.idea{color:var(--purple-500);} .ab-title.edit{color:#FB8C00;}
.analysis-block p{font-size:13px;color:var(--text-sub);line-height:1.6;}
.video-actions{display:flex;gap:8px;margin-top:4px;}
.platform-pick{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.platform-pick::-webkit-scrollbar{display:none;}
.pp-item{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:13px;color:var(--text-sub);cursor:pointer;}
.pp-item.active{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;border-color:transparent;}

/* === Library Cards === */
.lib-list{display:flex;flex-direction:column;gap:12px;}
.lib-card{padding:16px;transition:transform .2s,box-shadow .2s;}
.lib-card:active{transform:scale(.98);}
.lib-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.lib-platform{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;}
.lib-plays{font-size:12px;color:var(--text-mute);}
.lib-title{font-size:15px;font-weight:700;line-height:1.4;margin-bottom:10px;color:var(--text);}
.lib-kw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.lib-kw-item{font-size:11px;color:var(--pink-500);background:var(--pink-100);padding:3px 10px;border-radius:12px;}
.lib-actions{display:flex;gap:8px;}
.lib-actions .btn{flex:1;justify-content:center;}

/* === Library === */
.lib-table{width:100%;border-collapse:collapse;font-size:13px;}
.lib-table th{text-align:left;padding:10px 8px;font-size:11px;color:var(--text-mute);border-bottom:1px solid var(--border);font-weight:500;}
.lib-table td{padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.lib-table tr:last-child td{border-bottom:none;}
.t-title{font-weight:500;max-width:180px;}
.lib-link-btn{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;background:var(--pink-100);color:var(--pink-600);border-radius:12px;font-size:11px;text-decoration:none;}
.kw-chips{display:flex;flex-wrap:wrap;gap:4px;max-width:130px;}
.kw{font-size:10px;padding:2px 7px;background:var(--cream);border-radius:10px;color:var(--text-sub);}
.search-bar{display:flex;gap:8px;margin-bottom:14px;} .search-bar .input{flex:1;}

/* === Book === */
.book-banner{background:linear-gradient(135deg,var(--pink-100),var(--purple-100));border-radius:var(--radius);padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;}
.book-banner-cover{width:60px;height:80px;border-radius:8px;background:linear-gradient(135deg,var(--pink-300),var(--purple-300));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:var(--shadow);}
.book-banner-info .bb-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.book-banner-info .bb-author{font-size:12px;color:var(--text-sub);margin-bottom:4px;}
.book-banner-info .bb-tag{font-size:11px;color:var(--pink-600);font-weight:500;}
.book-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;display:flex;gap:14px;cursor:pointer;transition:transform .2s;}
.book-card:active{transform:scale(.98);}
.book-month{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,var(--pink-300),var(--purple-300));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.book-info{flex:1;min-width:0;}
.book-info .bi-title{font-size:14px;font-weight:600;margin-bottom:3px;}
.book-info .bi-author{font-size:12px;color:var(--text-sub);margin-bottom:6px;}
.book-info .bi-desc{font-size:12px;color:var(--text-sub);line-height:1.5;margin-bottom:8px;}
.book-tags{display:flex;flex-wrap:wrap;gap:4px;}

/* === Link Input === */
.link-input-wrap{position:relative;flex:1;display:flex;align-items:center;}
.link-input-wrap .input{flex:1;padding-right:90px;}
.link-platform-badge{position:absolute;right:8px;top:50%;transform:translateY(-50%);white-space:nowrap;}

/* === Review === */
.review-form{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
.review-form .rf-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.review-form .rf-title .dot{width:8px;height:8px;border-radius:50%;background:var(--pink-400);}
.metric-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.metric-input{background:var(--cream);border-radius:var(--radius-sm);padding:12px 14px;transition:box-shadow .2s;}
.metric-input:focus-within{box-shadow:0 0 0 2px var(--pink-200);}
.metric-input label{font-size:11px;color:var(--text-mute);display:block;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.metric-input label .mi-icon{font-size:14px;}
.metric-input input{width:100%;border:none;background:transparent;font-size:17px;font-weight:700;color:var(--text);font-family:inherit;padding:0;}
.metric-input input:focus{outline:none;}
.metric-input .mi-unit{font-size:11px;color:var(--text-mute);margin-top:2px;}
.review-form .rf-row{display:flex;gap:10px;margin-bottom:12px;}
.review-form .rf-row .input,.review-form .rf-row .select{flex:1;}
.review-form .rf-submit{margin-top:4px;}
.diag-result{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.diag-result .dr-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.diag-result .dr-score{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;}
.diag-result .dr-score.great{background:linear-gradient(135deg,#43A047,#66BB6A);}
.diag-result .dr-score.good{background:linear-gradient(135deg,#FB8C00,#FFA726);}
.diag-result .dr-score.bad{background:linear-gradient(135deg,#E53935,#EF5350);}
.diag-result .dr-title{font-size:15px;font-weight:700;}
.diag-result .dr-sub{font-size:12px;color:var(--text-sub);}
.diag-item{display:flex;gap:12px;padding:14px;border-radius:var(--radius-sm);margin-bottom:10px;border-left:4px solid transparent;}
.diag-item.warn{border-left-color:#EF4444;background:#FFF5F5;}
.diag-item.good{border-left-color:#43A047;background:#F1F8F4;}
.diag-icon{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
.diag-item.warn .diag-icon{background:#FFEBEE;color:#E53935;}
.diag-item.good .diag-icon{background:#E8F5EE;color:#43A047;}
.dc-head{font-size:13px;font-weight:700;margin-bottom:4px;}
.dc-body{font-size:12px;color:var(--text-sub);line-height:1.5;}
.dc-action{font-size:13px;color:var(--pink-600);margin-top:6px;font-weight:600;background:var(--pink-100);display:inline-block;padding:3px 10px;border-radius:8px;}
.history-item{padding:16px;cursor:pointer;transition:all .2s;}
.history-item:hover{box-shadow:var(--shadow-md);}
.history-item .hi-expand{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.history-item.open .hi-expand{display:block;}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.history-title{font-size:14px;font-weight:600;}
.history-date{font-size:11px;color:var(--text-mute);}
.history-metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.hm{font-size:11px;padding:3px 8px;background:var(--cream);border-radius:10px;color:var(--text-sub);}
.hm.highlight{background:var(--pink-100);color:var(--pink-600);font-weight:600;}
.archive-stats{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.archive-stat{flex:1;min-width:80px;text-align:center;padding:12px 8px;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);}
.archive-stat .as-val{font-size:20px;font-weight:700;color:var(--pink-500);}
.archive-stat .as-label{font-size:11px;color:var(--text-mute);margin-top:2px;}

/* === Finance === */
.finance-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;}
.finance-head{background:linear-gradient(135deg,var(--purple-100),var(--pink-100));padding:14px;}
.finance-cat{font-size:11px;color:var(--purple-500);font-weight:600;margin-bottom:4px;}
.finance-title{font-size:14px;font-weight:600;}
.finance-body{padding:14px;}
.finance-desc{font-size:13px;color:var(--text-sub);line-height:1.6;margin-bottom:10px;}
.finance-tip{background:var(--cream);border-radius:var(--radius-sm);padding:10px;font-size:12px;color:var(--text);}
.finance-tip b{color:var(--purple-500);}

/* === Modal === */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-sheet{background:var(--card);width:90%;max-width:420px;border-radius:var(--radius);padding:20px;animation:scaleIn .25s;max-height:85vh;overflow-y:auto;}
@keyframes scaleIn{from{transform:scale(.9);opacity:0;}to{transform:none;opacity:1;}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(74,59,79,.92);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:100;animation:tin .3s,tout .3s 1.7s forwards;white-space:nowrap;}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes tout{to{opacity:0;transform:translate(-50%,-10px);}}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-mute);}
.empty-state p{font-size:13px;margin-top:8px;}
.section-divider{height:1px;background:var(--border);margin:16px 0;}
.text-mute{color:var(--text-mute);font-size:12px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.mt-12{margin-top:12px;} .mb-12{margin-bottom:12px;}

/* === Clip Tips === */
.clip-card{border:none;border-left:3px solid var(--purple-300);background:linear-gradient(135deg,#faf5ff,#fff5f7);padding:0;overflow:hidden;}
.clip-header{display:flex;align-items:center;gap:8px;padding:12px 16px 0;}
.clip-day{font-size:11px;color:var(--purple-500);font-weight:700;background:#EDE4FF;padding:2px 8px;border-radius:10px;}
.clip-idx{font-size:12px;color:var(--text-mute);flex:1;}
.clip-body{padding:12px 16px 16px;}
.clip-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.4;}
.clip-desc{font-size:13px;color:var(--text-sub);line-height:1.75;margin-bottom:12px;}
.clip-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.clip-tag{font-size:11px;color:var(--purple-500);background:#EDE4FF;padding:2px 8px;border-radius:10px;}
.clip-meta{margin-bottom:12px;}
.clip-btn{display:inline-flex!important;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--purple-300),var(--pink-400))!important;border:none!important;color:#fff!important;font-weight:600;font-size:13px;padding:10px 16px!important;border-radius:20px!important;transition:transform .15s,box-shadow .15s;}
.clip-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(168,85,247,.3);}
.tag-sm{font-size:10px!important;padding:2px 8px!important;border-radius:8px!important;}

/* === Calendar Grid === */
.cal-header-card{margin-bottom:12px;}
.cal-grid{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.cal-weekday{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:10px 0 6px;font-size:11px;color:var(--text-mute);font-weight:500;border-bottom:1px solid var(--border);}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);padding:4px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px;border-radius:10px;cursor:pointer;transition:background .15s;position:relative;min-height:50px;}
.cal-cell:hover{background:var(--pink-100);}
.cal-cell.empty{pointer-events:none;}
.cal-cell.today{background:var(--pink-100);}
.cal-cell.today .cal-day{color:var(--pink-600);font-weight:700;}
.cal-cell.weekend .cal-day{color:var(--text-mute);}
.cal-day{font-size:13px;font-weight:500;margin-bottom:2px;}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cal-item{padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}

/* === Account Info Card === */
.acc-info-card{border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.acc-header{display:flex;align-items:center;gap:14px;}
.acc-avatar{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;color:#fff;}
.acc-meta{flex:1;min-width:0;}
.acc-name{font-weight:700;font-size:16px;margin-bottom:2px;}
.acc-desc{font-size:12px;color:var(--text-sub);line-height:1.4;}
.acc-publish{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.acc-pub-stat{text-align:center;flex:1;}
.acc-pub-val{font-size:20px;font-weight:700;}
.acc-pub-label{font-size:11px;color:var(--text-mute);}
.acc-mini-schedule{font-size:12px;color:var(--text-sub);margin-top:10px;line-height:1.8;}
.acc-mini-schedule span{display:inline-block;background:var(--pink-100);color:var(--pink-600);padding:1px 8px;border-radius:10px;margin:2px 4px 2px 0;font-size:11px;}

/* === KR Card === */
.kr-card{border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;background:var(--card);}
.kr-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.kr-card .progress-bar{margin-top:10px;}

/* === Category Filter Tabs === */
.cat-filter{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap;}
.cat-filter::-webkit-scrollbar{display:none;}
.cat-item{flex-shrink:0;padding:6px 14px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:12px;color:var(--text-sub);cursor:pointer;transition:all .2s;white-space:nowrap;}
.cat-item.active{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;border-color:transparent;}

/* === Account Filter in Review === */
.review-filter{display:flex;gap:8px;margin-bottom:12px;}
.review-filter select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--cream);font-size:13px;font-family:inherit;color:var(--text);}
.review-filter select:focus{outline:none;border-color:var(--pink-300);}

/* === Ecommerce Hot Radar === */
.ec-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#E8F5E9,#F1F8E9);border-radius:var(--radius-sm);margin-bottom:16px;}
.ec-header-icon{font-size:28px;}
.ec-filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.ec-filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--text-sub);cursor:pointer;transition:all .2s;}
.ec-filter-btn.active{background:var(--pink-400);color:#fff;border-color:var(--pink-400);}
.ec-filter-btn.novice{color:#43A047;border-color:#43A04740;}
.ec-filter-btn.novice.active{background:#43A047;border-color:#43A047;color:#fff;}
.ec-card{border-radius:var(--radius-sm);margin-bottom:14px;overflow:hidden;}
.ec-card-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.ec-hot{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px;}
.ec-meta-row{display:flex;gap:6px;flex-wrap:wrap;}
.ec-meta{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;background:var(--pink-50);color:var(--text-sub);}
.ec-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.4;}
.ec-desc{font-size:13px;color:var(--text-sub);margin-bottom:10px;line-height:1.5;}
.ec-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.ec-tag{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;}
.ec-platform{margin-bottom:12px;font-size:12px;color:var(--text-sub);}
.ec-section{margin-bottom:10px;padding:10px 12px;background:var(--pink-50);border-radius:10px;}
.ec-sec-title{font-size:12px;font-weight:700;color:var(--pink-500);margin-bottom:4px;}
.ec-section p{font-size:12px;color:var(--text-sub);margin:0;line-height:1.5;}
.ec-action-bar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);}
.ec-exp-badge{font-size:11px;color:#43A047;font-weight:500;background:#E8F5E9;padding:4px 10px;border-radius:10px;}
/* Experiment Panel */
.exp-panel{background:linear-gradient(135deg,#FFF8E1,#FFF3E0);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;}
.exp-panel-title{font-size:14px;font-weight:700;color:#E65100;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.exp-stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
.exp-stat{text-align:center;}
.exp-stat-val{font-size:18px;font-weight:700;color:#E65100;}
.exp-stat-label{font-size:11px;color:var(--text-mute);}
.exp-list{margin-top:8px;}
.exp-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:12px;gap:8px;}
.exp-item-title{flex:1;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-item-plays{color:var(--text-sub);white-space:nowrap;}
.exp-item-status{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap;}
.exp-empty{text-align:center;padding:16px;color:var(--text-mute);font-size:13px;}
.exp-add-btn{margin-top:8px;width:100%;}

/* === Responsive === */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.12);}

  .sidebar-overlay.show{display:block;}

  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .content{padding:14px 14px 20px;}
  .hero-time .ht-time{font-size:30px;}
}
@media(min-width:769px){.sidebar-overlay{display:none!important;}}

{id:'f1',cat:'\u91d1\u94b1\u601d\u7ef4',title:'\u5bcc\u4eba\u4e3a\u4ec0\u4e48\u4e0d\u4e70\u623f\uff1f\u89e3\u5bc6\u8d22\u52a1\u81ea\u7531\u7684\u6838\u5fc3\u903b\u8f91',desc:'\u5bcc\u4eba\u4e0d\u662f\u6ca1\u94b1\u4e70\u623f\uff0c\u800c\u662f\u660e\u767d\u8d44\u91d1\u6d41\u52a8\u6027\u548c\u8d44\u4ea7\u589e\u503c\u7684\u5173\u7cfb\u3002\u623f\u4ea7\u662f\u8d1f\u503a\uff0c\u4f1a\u9501\u6b7b\u8d44\u91d1\u3002',tip:'\u5b66\u4e60\u91cd\u70b9\uff1a\u8d44\u4ea7=\u80fd\u4ea7\u751f\u73b0\u91d1\u6d41\u7684\u4e1c\u897f\uff1b\u8d1f\u503a=\u6d88\u8017\u73b0\u91d1\u6d41\u7684\u4e1c\u897f\u3002\u624b\u5934\u73b0\u91d1\u5148\u4e70\u80fd\u4ea7\u751f\u6536\u76ca\u7684\u8d44\u4ea7\uff0c\u518d\u8003\u8651\u6d88\u8d39\u578b\u8d44\u4ea7\u3002'},

// === 第1阶段：选工具 + 认识基础功能（Day 1-7）===
{id:'c1',stage:1,day:1,idx:1,title:'剪映vs快影vs必剪：新手到底选哪个？',desc:'三个都是手机剪辑神器。剪映功能最全（推荐首选），快影模板多适合快手风，必剪B站生态好。新手直接下剪映就够了——它内置AI字幕、海量素材库、一键成片，零基础也能快速上手。',platform:'B站',difficulty:'入门',tags:['选工具','剪映','新手必看'],url:'https://search.bilibili.com/all?keyword=剪映新手入门教程&order=click'},
{id:'c2',stage:1,day:1,idx:2,title:'打开剪映第一件事：认识这5个核心区域',desc:'①素材区（左下角）— 放你的视频片段 ②预览区（中间）— 实时看效果 ③时间轴（底部）— 这是你剪视频的主战场 ④工具栏（底部横条）— 分割、变速、转场都在这 ⑤导出区（右上角）— 设置分辨率和帧率。先花10分钟每个按钮点一遍，心里有个大概就行。',platform:'B站',difficulty:'入门',tags:['剪映界面','基础认知','第一天'],url:'https://search.bilibili.com/all?keyword=剪映界面功能介绍&order=click'},
{id:'c3',stage:1,day:2,idx:1,title:'第一个实操：导入素材+分割删除不想要的片段',desc:'打开剪映→点击"开始创作"→选一段视频导入→拖动时间轴白线到想删的地方→点底部"分割"→选中不要的那段→点"删除"。这就是剪辑最基础的动作，任何大片都是从这一步开始的。',platform:'抖音',difficulty:'入门',tags:['分割','删除','第一次剪辑'],url:'https://www.douyin.com/search/剪映分割删除教程&type=video'},
{id:'c4',stage:1,day:2,idx:2,title:'画面比例怎么选？横屏竖屏到底用哪个',desc:'抖音/快手/小红书用9:16竖屏，B站横屏16:9，朋友圈1:1方屏。在剪映底部点"比例"就能切换。新手最常见错误：竖屏视频里放了横屏素材没裁切，导致上下大黑边。选中素材→双指缩放填满画面即可。',platform:'B站',difficulty:'入门',tags:['画面比例','横竖屏','基础设置'],url:'https://search.bilibili.com/all?keyword=剪映画面比例设置&order=click'},
{id:'c5',stage:1,day:3,idx:1,title:'音量调节+静音+淡入淡出，3个音频基本功',desc:'点击视频轨道→底部"音量"→拖动滑块调大小。原声太吵直接拉到0静音。片头片尾用"淡入淡出"：开头音量从0渐强，结尾从强渐弱，这个技巧让你的视频一秒变专业。关键：背景音乐音量永远比人声低30%。',platform:'抖音',difficulty:'入门',tags:['音量','淡入淡出','音频基础'],url:'https://www.douyin.com/search/剪映音量调节淡入淡出&type=video'},
{id:'c6',stage:1,day:3,idx:2,title:'关闭原声+添加背景音乐，两步搞定',desc:'抖音视频大多不需要原声。点视频轨道→底部"音量"→拉到0静音。然后点"音频"→"音乐"→选热门BGM或搜索你想用的歌→点"使用"。新手推荐"卡点音乐"分类，节奏感强，帮你自然掌握剪辑节奏。',platform:'B站',difficulty:'入门',tags:['背景音乐','BGM','音频'],url:'https://search.bilibili.com/all?keyword=剪映添加背景音乐&order=click'},
{id:'c7',stage:1,day:4,idx:1,title:'什么是轨道？主轨+画中画的区别一次讲清楚',desc:'主轨道是你视频的"底"，上面的画中画轨道是叠加上去的"层"。可以叠加视频、图片、文字。比如你想在视频左上角放一个logo，就把logo图片加到画中画轨道，双指拖动调位置和大小。主轨+画中画=无限创意空间。',platform:'B站',difficulty:'入门',tags:['轨道','画中画','图层概念'],url:'https://search.bilibili.com/all?keyword=剪映轨道画中画教程&order=click'},
{id:'c8',stage:1,day:4,idx:2,title:'视频变速：慢动作+快进怎么调',desc:'选中视频→底部"变速"→"常规变速"拖动滑块：<1倍是慢动作（适合强调细节），>1倍是快进（适合加速无聊段落）。还有个"曲线变速"可以让同一段视频先快后慢再快，做出炫酷的节奏变化。',platform:'抖音',difficulty:'入门',tags:['变速','慢动作','快进'],url:'https://www.douyin.com/search/剪映变速教程&type=video'},
{id:'c9',stage:1,day:5,idx:1,title:'一键添加字幕：AI自动识别，10秒搞定',desc:'剪映点底部"文字"→"识别字幕"→等待自动生成→检查改错字。这是剪映最省时的功能！识别完可以在"样式"里换字体、改颜色、加描边。新手推荐用"新青年体"或"优设标题黑"，清晰又有设计感。',platform:'B站',difficulty:'入门',tags:['字幕','AI识别','文字'],url:'https://search.bilibili.com/all?keyword=剪映自动字幕教程&order=click'},
{id:'c10',stage:1,day:5,idx:2,title:'花字排版：让字幕不再死板的3个秘诀',desc:'①每行不超过15个字，多了分行 ②重点词换颜色（红/黄/蓝三色原则）③加一点描边或阴影让字更清晰。高级玩法：把"惊讶""绝了""救命"这些情绪词单独放大+换颜色，视觉冲击力翻倍。',platform:'抖音',difficulty:'入门',tags:['花字','字幕排版','视觉'],url:'https://www.douyin.com/search/剪映花字排版技巧&type=video'},
{id:'c11',stage:1,day:6,idx:1,title:'转场是什么？新手必学的3个基��转场',desc:'两个片段之间的过渡效果就叫"转场"。新手先用这3个：①叠化（最自然，适合所有场景）②闪白（适合节奏快的卡点视频）③幻灯片（左右滑入，适合图文切换）。别滥用花里胡哨的转场，越简单越高级。',platform:'B站',difficulty:'入门',tags:['转场','过渡','基础'],url:'https://search.bilibili.com/all?keyword=剪映转场教程新手&order=click'},
{id:'c12',stage:1,day:6,idx:2,title:'滤镜+调节：3步让你的画面有"网感"',desc:'①点"滤镜"→选"自然"或"美食"分类→强度调到60% ②点"调节"→亮度+5、对比度+8、饱和度-3、锐化+15 ③加一点暗角。这个万能公式能让任何手机拍的视频质感提升一个档次。',platform:'抖音',difficulty:'入门',tags:['滤镜','调色','网感'],url:'https://www.douyin.com/search/剪映滤镜调色新手&type=video'},
{id:'c13',stage:1,day:7,idx:1,title:'导出设置别乱选：分辨率+帧率怎么设',desc:'点右上角"导出"→分辨率选1080p（最通用）→帧率选30fps（日常够用）或60fps（画面更流畅但文件大）。千万不要选720p，导出来模糊。码率选"推荐"即可。导出前关掉"添加片尾"那个勾，不然剪映会给你自动加广告。',platform:'B站',difficulty:'入门',tags:['导出','分辨率','帧率'],url:'https://search.bilibili.com/all?keyword=剪映导出设置教程&order=click'},
{id:'c14',stage:1,day:7,idx:2,title:'阶段小结：恭喜你！7天从0到能独立剪一条视频',desc:'回顾一下你学会的：分割删除、音量调节、加BGM、加字幕、变速、转场、滤镜调色、导出。这些就是剪映80%的核心功能。下一步进入快捷键阶段，让剪辑速度翻倍。今天试着用这些技能剪一条30秒的短视频吧！',platform:'抖音',difficulty:'入门',tags:['阶段总结','复习','里程碑'],url:'https://www.douyin.com/search/剪映新手实操完整流程&type=video'},

// === 第2阶段：快捷键 + 效率提升（Day 8-14）===
{id:'c15',stage:2,day:8,idx:1,title:'剪映电脑版快捷键：这10个让你效率翻倍',desc:'电脑端剪映比手机快3倍！必背快捷键：空格=播放/暂停、Ctrl+B=分割、Delete=删除、Ctrl+Z=撤销、Ctrl+C/V=复制粘贴、↑↓=上一帧下一帧（精细剪辑必备）、Ctrl+滚轮=缩放时间轴、Alt+滚轮=左右滚动时间轴。花10分钟练熟，从此告别手指戳屏幕。',platform:'B站',difficulty:'进阶',tags:['快捷键','效率','电脑版'],url:'https://search.bilibili.com/all?keyword=剪映电脑版快捷键&order=click'},
{id:'c16',stage:2,day:8,idx:2,title:'手机党也能提速：剪映手势操作大全',desc:'不习惯电脑剪辑？手机也有"快捷键"：双指捏合缩放时间轴、单指拖动移动素材、长按素材拖动调顺序、双击素材快速预览、三指同时滑动可以快速定位。这些手势用熟了，手机剪辑不比电脑慢。',platform:'抖音',difficulty:'入门',tags:['手势','手机剪辑','效率'],url:'https://www.douyin.com/search/剪映手势操作技巧&type=video'},
{id:'c17',stage:2,day:9,idx:1,title:'批量操作技巧：一键替换+批量调色',desc:'电脑版剪映可以多选素材批量操作：按住Ctrl点击多个素材→右键"替换素材"可以一键替换所有同类型素材。调好一个片段的滤镜和调节参数后→右键"复制属性"→选中其他片段→"粘贴属性"，全部统一风格。',platform:'B站',difficulty:'进阶',tags:['批量操作','效率','统一风格'],url:'https://search.bilibili.com/all?keyword=剪映批量调色替换素材&order=click'},
{id:'c18',stage:2,day:9,idx:2,title:'建立你的素材库：分类管理不手忙脚乱',desc:'在手机建3个文件夹：①我的素材（拍的视频/图片）②BGM库（收藏的背景音乐）③灵感参考（截图别人的好作品）。剪映里也有"素材库"和"收藏"功能，看到好的贴纸、音效、滤镜点收藏，下次直接调用不用翻半天。',platform:'抖音',difficulty:'入门',tags:['素材库','管理','效率'],url:'https://www.douyin.com/search/剪映素材管理技巧&type=video'},
{id:'c19',stage:2,day:10,idx:1,title:'草稿管理：一个项目多个版本怎么保存',desc:'剪映的"草稿箱"会自动保存，但一个视频改来改去怎么办？技巧：每做一个大改动前→点"草稿箱"里的三点菜单→"复制草稿"→给副本改个名字（比如"V1初版""V2加字幕版"）。这样改坏了随时能回退。',platform:'B站',difficulty:'入门',tags:['草稿','版本管理','备份'],url:'https://search.bilibili.com/all?keyword=剪映草稿管理技巧&order=click'},
{id:'c20',stage:2,day:10,idx:2,title:'剪辑工作流：从拿到素材到出片的黄金流程',desc:'高手的工作流：①粗剪（删废镜头，只留有用的）→②精剪（调顺序、卡节奏）→③加转场/特效→④加字幕→⑤调色→⑥配BGM+音效→⑦整体预览+微调→⑧导出。记住这个顺序，不要再一边加字幕一边调色，效率会很低。',platform:'抖音',difficulty:'进阶',tags:['工作流','流程','效率'],url:'https://www.douyin.com/search/剪辑工作流程新手&type=video'},
{id:'c21',stage:2,day:11,idx:1,title:'快速粗剪法：如何10分钟搞定素材筛选',desc:'粗剪核心是"狠"：导入所有素材→快速过一遍→只要犹豫"这段要不要"就直接删。用分割快捷键快速切掉废镜头。先不管转场、字幕、调色，只做一件事：把有用的片段按顺序排好。粗剪完成，视频骨架就有了。',platform:'B站',difficulty:'入门',tags:['粗剪','效率','素材筛选'],url:'https://search.bilibili.com/all?keyword=粗剪素材筛选技巧&order=click'},
{id:'c22',stage:2,day:11,idx:2,title:'标记功能：给关键片段做标记，精剪不迷路',desc:'电脑版剪映时间轴上右键→"添加标记"，或者在重要位置点M键。标记可以帮你快速定位：高潮部分标红、转场位置标黄、需要加字幕的地方标蓝。回看时一键跳转，不用反复拖动时间轴找位置。',platform:'B站',difficulty:'进阶',tags:['标记','定位','效率'],url:'https://search.bilibili.com/all?keyword=剪映标记功能使用&order=click'},
{id:'c23',stage:2,day:12,idx:1,title:'对齐音频波形：让画面切换跟着音乐节奏走',desc:'导入音乐后→放大音频轨道→看到高低起伏的"波形"。每个波峰就是一个重拍/鼓点。在这些位置切画面、切换镜头，出来的效果就是"卡点"。这是从普通剪辑到"有节奏感"剪辑的质变一步。',platform:'抖音',difficulty:'进阶',tags:['波形','卡点','节奏感'],url:'https://www.douyin.com/search/音频波形卡点剪辑教程&type=video'},
{id:'c24',stage:2,day:12,idx:2,title:'J-cut和L-cut：让声音走在画面前面',desc:'J-cut：下一个镜头的音频提前进入（先闻其声再见其人），L-cut：当前镜头的音频延续到下一画面。实操：剪映里把音频轨道往左拖0.3秒就实现了J-cut。这个技巧能让转场无比丝滑，是电影感的入门必修课。',platform:'B站',difficulty:'进阶',tags:['J-cut','L-cut','转场'],url:'https://search.bilibili.com/all?keyword=Jcut+Lcut剪辑技巧&order=click'},
{id:'c25',stage:2,day:13,idx:1,title:'模板一键成片：3分钟搞定一条视频',desc:'剪映"一键成片"功能：点"图文成片"→输入文字或粘贴文章→AI自动匹配画面+配音+字幕。适合做口播类、知识分享类视频。生成的视频可以再手动微调替换不合适的画面。这是效率工具，不是偷懒，合理利用能节省大量时间。',platform:'B站',difficulty:'入门',tags:['模板','一键成片','AI'],url:'https://search.bilibili.com/all?keyword=剪映一键成片教程&order=click'},
{id:'c26',stage:2,day:13,idx:2,title:'常用素材一键收藏：音效/贴纸/滤镜快速调用',desc:'剪辑时发现好用的音效、贴纸、文字模板→点旁边的⭐收藏。下次做同类型视频直接去"收藏"里找，效率翻倍。建议按分类收藏：搞笑音效一类、转场音效一类、综艺花字一类。素材积累越丰富，剪辑越顺手。',platform:'抖音',difficulty:'入门',tags:['收藏','素材','效率'],url:'https://www.douyin.com/search/剪映收藏功能使用技巧&type=video'},
{id:'c27',stage:2,day:14,idx:1,title:'阶段小结：效率就是竞争力',desc:'这两周你学会了：快捷键/手势操作、粗精剪分离、批量操作、音频波形卡点、J-cut/L-cut、模板高效出片、素材库管理。现在你剪一条视频的速度应该比两周前快3倍以上。接下来进入实战技巧阶段！',platform:'B站',difficulty:'进阶',tags:['阶段总结','效率','里程碑'],url:'https://search.bilibili.com/all?keyword=剪映高效剪辑流程&order=click'},
{id:'c28',stage:2,day:14,idx:2,title:'练习作业：用新学的快捷键剪一条15秒卡点视频',desc:'找一首你喜欢的快节奏BGM→用波形定位8-10个卡点→每个卡点切一个画面→加转场和字幕→导出。要求：全部用快捷键操作，全程不超过20分钟。做完你会惊讶自己进步有多快。',platform:'抖音',difficulty:'进阶',tags:['练习','卡点','作业'],url:'https://www.douyin.com/search/15秒卡点视频教程&type=video'},

// === 第3阶段：基础功能深度运用（Day 15-21）===
{id:'c29',stage:3,day:15,idx:1,title:'关键帧完全指南：让你的画面"动"起来',desc:'关键帧是剪映最强大的功能之一。选中素材→点"关键帧"菱形按钮→移动时间轴→改变素材位置/大小/透明度→自动生成动画。比如做一个文字从左边飞到右边的动画：开头打关键帧（文字在左边）→0.5秒后打关键帧（文字拖到右边）。',platform:'B站',difficulty:'进阶',tags:['关键帧','动画','核心技巧'],url:'https://search.bilibili.com/all?keyword=剪映关键帧教程&order=click'},
{id:'c30',stage:3,day:15,idx:2,title:'关键帧实战①：片头文字弹出动画',desc:'用关键帧做3种最火的文字动画：①缩放弹跳（开头100%→0.2秒后120%→0.3秒后100%回弹）②从下飞入（开头Y轴在画面外→0.5秒后Y轴归位）③逐字出现（每0.1秒打一个关键帧，逐个显示文字）。',platform:'抖音',difficulty:'进阶',tags:['关键帧','文字动画','实战'],url:'https://www.douyin.com/search/剪映关键帧文字动画&type=video'},
{id:'c31',stage:3,day:16,idx:1,title:'蒙版入门：用"圆形蒙版"做画中画头像',desc:'蒙版=给画面开一扇任意形状的窗。实操：添加画中画→点"蒙版"→选"圆形"→双指调整大小和位置→羽化值拉到5让边缘柔和。这就是那些视频里左下角小头像的做法。矩形蒙版可以做分屏效果，线性蒙版可以做渐变消失。',platform:'B站',difficulty:'进阶',tags:['蒙版','画中画','核心技巧'],url:'https://search.bilibili.com/all?keyword=剪映蒙版教程&order=click'},
{id:'c32',stage:3,day:16,idx:2,title:'蒙版实战②：文字遮罩动画（高级文字效果）',desc:'文字遮罩=文字里出现画面。做法：添加文字→导出为视频→重新导入→放画中画→对画中画加文字轨道→用文字做蒙版。这个效果在影视解说和产品测评里特别出彩，比普通字幕高级很多。',platform:'B站',difficulty:'进阶',tags:['蒙版','文字遮罩','高级'],url:'https://search.bilibili.com/all?keyword=剪映文字遮罩蒙版&order=click'},
{id:'c33',stage:3,day:17,idx:1,title:'曲线变速：先快后慢，做出"子弹时间"效果',desc:'选中视频→变速→曲线变速→选"自定义"。在曲线上打点：开头快速→中间瞬间极慢→结尾恢复正常速度。这个效果就是短视频里最火的"哇这个瞬间"——前奏快节奏铺垫→关键时刻慢放强调→回归正常。',platform:'抖音',difficulty:'进阶',tags:['曲线变速','慢动作','高级'],url:'https://www.douyin.com/search/剪映曲线变速教程&type=video'},
{id:'c34',stage:3,day:17,idx:2,title:'混合模式：让画面叠加更有质感',desc:'选中画中画素材→点"混合模式"→试试"滤色"（去黑底保留亮部，适合加光效）、"正片叠底"（去白底保留暗部，适合加阴影）、"叠加"（增强对比，适合加纹理）。这个功能让你的视频层次感暴增。',platform:'B站',difficulty:'进阶',tags:['混合模式','叠加','高级'],url:'https://search.bilibili.com/all?keyword=剪映混合模式教程&order=click'},
{id:'c35',stage:3,day:18,idx:1,title:'抠图换背景：绿幕+智能抠像，在家拍出大片感',desc:'剪映的"智能抠像"超好用：选中人物视频→点"抠像"→"智能抠像"→自动把人抠出来→换上任何背景。没有绿幕也能用！光线好、人物和背景对比明显时效果最佳。穿搭博主、口播博主用这个可以省掉布景的钱。',platform:'B站',difficulty:'进阶',tags:['抠像','换背景','高级'],url:'https://search.bilibili.com/all?keyword=剪映智能抠像教程&order=click'},
{id:'c36',stage:3,day:18,idx:2,title:'定格动画：让画面瞬间冻结+放大',desc:'选中视频→在想要定格的瞬间点"分割"→选中后面那段→点底部"定格"→生成3秒的静态图→给这张图加关键帧做放大+抖动效果。这就是"刚刚那个画面太炸了"的同款效果，卡点视频必备。',platform:'抖音',difficulty:'入门',tags:['定格','冻结','卡点'],url:'https://www.douyin.com/search/剪映定格动画教程&type=video'},
{id:'c37',stage:3,day:19,idx:1,title:'贴纸玩法：动态贴纸+跟踪功能',desc:'点"贴纸"→搜索关键词（比如"箭头""爆炸""爱心"）→添加到画面→拖动调位置。高级玩法："跟踪"功能——选中贴纸→点"跟踪"→圈出画面中移动的物体→贴纸会自动跟随那个物体移动。适合做产品标注、人物追踪。',platform:'B站',difficulty:'入门',tags:['贴纸','跟踪','趣味'],url:'https://search.bilibili.com/all?keyword=剪映贴纸跟踪功能&order=click'},
{id:'c38',stage:3,day:19,idx:2,title:'画中画+蒙版+关键帧三合一：做一个电影感片头',desc:'实操一条完整的高级片头：①主轨道放风景视频→②画中画加文字图片→③给文字加圆形蒙版→④打关键帧让蒙版从小到大展开→⑤混合模式调"滤色"。这就是电影级片头的做法，做完你会发现自己已经远超大多数新手。',platform:'B站',difficulty:'进阶',tags:['综合实战','片头','三合一'],url:'https://search.bilibili.com/all?keyword=剪映电影感片头教程&order=click'},
{id:'c39',stage:3,day:20,idx:1,title:'动画+关键帧组合技：做出画面缩放+旋转的运镜感',desc:'不是只有推拉摇移才是运镜，后期也能做。给视频打关键帧：开头scale=100%、中间=120%、结尾=100%，再加一个开头rotation=0°→结尾rotation=3°的微旋转。这就是"呼吸感运镜"，非常适合产品展示视频。',platform:'抖音',difficulty:'进阶',tags:['运镜','缩放','关键帧'],url:'https://www.douyin.com/search/剪映关键帧运镜效果&type=video'},
{id:'c40',stage:3,day:20,idx:2,title:'特效面板：学会看预览+调参数，不乱用',desc:'剪映"特效"面板有上百种效果，但80%都很土。记住原则：①特效宁少勿多，一个视频最多2-3个 ②看预览别只看名字 ③每种特效都可以调速度和强度，默认参数往往太夸张。推荐几个高级不土的：镜头模糊、胶片刮痕、光斑、色散。',platform:'B站',difficulty:'入门',tags:['特效','审美','克制'],url:'https://search.bilibili.com/all?keyword=剪映特效使用技巧&order=click'},
{id:'c41',stage:3,day:21,idx:1,title:'阶段小结：你已经会了剪映90%的高级功能',desc:'这周你掌握了：关键帧动画、蒙版、曲线变速、混合模式、智能抠像、跟踪贴纸、综合特效。现在你已经不是新手了，这些功能用好任何一个都能做出爆款。下周进入实战环节，学以致用！',platform:'B站',difficulty:'进阶',tags:['阶段总结','里程碑','进阶'],url:'https://search.bilibili.com/all?keyword=剪映进阶技巧合集&order=click'},
{id:'c42',stage:3,day:21,idx:2,title:'练习作业：用关键帧+蒙版+曲线变速做一条产品展示视频',desc:'找一个你身边的物品（手机/水杯/化妆品都行）→拍3-5个角度→用关键帧做缩放运镜→用蒙版做文字遮罩→用曲线变速做关键瞬间慢放→导出。这条视频放在小红书或抖音上，绝对不像新手做的。',platform:'抖音',difficulty:'进阶',tags:['综合练习','作业','产品展示'],url:'https://www.douyin.com/search/产品展示剪辑教程&type=video'},

// === 第4阶段：实战练习 + 拉片分析（Day 22-35）===
{id:'c43',stage:4,day:22,idx:1,title:'口播视频剪辑全流程：从拍摄到出片',desc:'口播是自媒体最基础的视频类型。剪辑要点：①剪掉所有"嗯啊然后"的口头禅 ②每换一个话题加一个3帧的缩放跳切（掩盖剪辑痕迹）③关键句加放大文字强调 ④全程配轻量BGM（音量15%）。整体节奏要快，一个句子不超过5秒。',platform:'B站',difficulty:'进阶',tags:['口播','实战','自媒体'],url:'https://search.bilibili.com/all?keyword=口播视频剪辑技巧&order=click'},
{id:'c44',stage:4,day:22,idx:2,title:'信息流广告剪辑：15秒怎么让人停下来',desc:'信息流广告=抖音里那些"滑到就停下来的"视频。黄金公式：前3秒抛出痛点/悬念→中间快速展示产品卖点（3-5个画面）→结尾强CTA（点击下方/立即购买）。全程15-30秒，每个镜头不超过2秒，信息密度要高。',platform:'抖音',difficulty:'进阶',tags:['信息流','广告','实战'],url:'https://www.douyin.com/search/信息流广告剪辑技巧&type=video'},
{id:'c45',stage:4,day:23,idx:1,title:'Vlog剪辑：生活记录怎么剪得不无聊',desc:'Vlog最容易犯的错误：流水账。破解方法：①先定一个主题（比如"我的一天"不如"我今天只花了50块钱"）②按情绪起伏安排节奏，无聊的加速，好玩的慢放 ③穿插B-roll（空镜）增加氛围 ④片头用3秒精华预告。',platform:'B站',difficulty:'进阶',tags:['Vlog','实战','节奏'],url:'https://search.bilibili.com/all?keyword=Vlog剪辑技巧新手&order=click'},
{id:'c46',stage:4,day:23,idx:2,title:'开箱/测评视频剪辑：如何让产品看起来更香',desc:'开箱剪辑要点：①特写镜头占70%（产品细节）②使用微距运镜（关键帧模拟推拉）③拆包装的瞬间用慢动作+ASMR音效 ④对比画面用分屏蒙版 ⑤结尾加使用感受文字总结。节奏要紧凑，一个产品控制在60秒以内。',platform:'抖音',difficulty:'进阶',tags:['开箱','测评','实战'],url:'https://www.douyin.com/search/开箱测评剪辑技巧&type=video'},
{id:'c47',stage:4,day:24,idx:1,title:'知识分享类视频剪辑：怎么让干货不枯燥',desc:'干货类最大痛点：观众觉得无聊就划走了。破解：①每15-20秒切换一个画面（图表/素材/表情包）②用大字标题替代旁白说重点 ③加点搞笑音效和表情包活跃气氛 ④用"你肯定不知道"这种信息差钩子开场。',platform:'B站',difficulty:'进阶',tags:['知识分享','干货','实战'],url:'https://search.bilibili.com/all?keyword=知识类视频剪辑技巧&order=click'},
{id:'c48',stage:4,day:24,idx:2,title:'影视解说剪辑：3分钟讲完一部电影',desc:'影视解说=高密度信息+快节奏+情绪钩子。技巧：①片头3秒抛出最大悬念 ②全程1.3倍速旁白 ③关键画面定格+放大+音效强调 ④用"但是"制造反转节奏 ⑤结尾留一个开放问题引导评论。建议先模仿"毒舌电影"的节奏。',platform:'B站',difficulty:'进阶',tags:['影视解说','实战','节奏'],url:'https://search.bilibili.com/all?keyword=影视解说剪辑教程&order=click'},
{id:'c49',stage:4,day:25,idx:1,title:'拉片是什么？如何拆解一条爆款视频',desc:'拉片=逐秒分析别人的好作品。方法：找一个你喜欢的爆款视频→下载下来→导入剪映→逐秒看：①每个镜头多长时间？②转场用的是什么？③字幕怎么排的？④BGM什么时候进什么时候出？⑤钩子在第几秒？用笔记下来，这就是你的剪辑教科书。',platform:'B站',difficulty:'进阶',tags:['拉片','拆解','学习'],url:'https://search.bilibili.com/all?keyword=拉片分析教程&order=click'},
{id:'c50',stage:4,day:25,idx:2,title:'拉片实战：拆解一条千万播放的视频',desc:'找一条你赛道里的千万播放视频→下载→逐秒分析它的结构。问自己5个问题：①为什么前3秒我停下来了？②它用了什么情绪节奏（紧张→放松→高潮→结尾）？③BGM和画面怎么配合的？④字幕有什么特点？⑤结尾怎么引导互动的？把这些答案写下来，这就是你的剪辑学习笔记。',platform:'B站',difficulty:'进阶',tags:['拉片','实战','拆解'],url:'https://search.bilibili.com/all?keyword=爆款视频拆解分析&order=click'},
{id:'c51',stage:4,day:26,idx:1,title:'如何看别人的视频学剪辑（不只是看热闹）',desc:'看视频学剪辑的正确姿势：第一遍正常看（感受节奏和情绪）、第二遍关掉声音看画面（分析镜头切换频率和构图）、第三遍只听声音（分析BGM和音效的使用）、第四遍0.5倍速看（分析每个转场和特效的细节）。四遍下来你比90%的人学到更多。',platform:'B站',difficulty:'进阶',tags:['学习方法','看视频','审美'],url:'https://search.bilibili.com/all?keyword=如何通过看视频学剪辑&order=click'},
{id:'c52',stage:4,day:26,idx:2,title:'建立你的参考库：收藏100条好视频',desc:'在抖音/B站建一个"剪辑参考"收藏夹。按类型分类：口播类、Vlog类、开箱类、卡点类、知识分享类、搞笑类。每条收藏写一句备注：这条我学到了什么（比如"转场干净""字幕好看""节奏快"）。积累到100条，你的审美和判断力会质变。',platform:'抖音',difficulty:'入门',tags:['参考库','收藏','审美'],url:'https://www.douyin.com/search/剪辑灵感参考&type=video'},
{id:'c53',stage:4,day:27,idx:1,title:'B-roll拍摄：10个新手必备空镜角度',desc:'B-roll=辅助镜头，用来丰富画面。必备10个角度：①低角度仰拍走路 ②45度侧面跟拍 ③桌面俯拍物品 ④窗边逆光特写 ⑤慢动作甩头发/转身 ⑥延时摄影车流 ⑦微距拍文字/logo ⑧手持晃动营造呼吸感 ⑨前景虚化 ⑩无人机俯拍。每个视频穿插3-5个B-roll，质感立马翻倍。',platform:'B站',difficulty:'进阶',tags:['B-roll','拍摄','空镜'],url:'https://search.bilibili.com/all?keyword=Broll拍摄技巧&order=click'},
{id:'c54',stage:4,day:27,idx:2,title:'音效库搭建：20个让视频"有网感"的必备音效',desc:'网感视频的灵魂是音效！必备清单：综艺爆笑、疑问音效、提示叮、转场whoosh、紧张心跳、打字键盘、消息提示、鼓掌欢呼、尴尬沉默、魔法音效。使用原则：每个音效音量降到30%，宁少勿多，点缀即可。剪映自带音效库基本够用。',platform:'抖音',difficulty:'入门',tags:['音效','网感','素材库'],url:'https://www.douyin.com/search/剪辑音效素材推荐&type=video'},
{id:'c55',stage:4,day:28,idx:1,title:'封面设计3秒法则：大字+对比色+情绪脸',desc:'封面决定80%的点击率！公式：①主标题不超过6个字，字号占封面1/3 ②背景用高饱和对比色（黄配紫、橙配蓝）③放一张你的表情特写（惊讶/疑惑/开心）④角落加一个数字钩子（如"第3个绝了"）。用醒图或Canva 3分钟搞定。',platform:'B站',difficulty:'入门',tags:['封面','点击率','设计'],url:'https://search.bilibili.com/all?keyword=视频封面设计技巧&order=click'},
{id:'c56',stage:4,day:28,idx:2,title:'标题怎么写？5个爆款标题公式',desc:'标题和封面同样重要！5个万能公式：①数字型（"5个你不知道的iPhone技巧"）②悬念型（"用了这个方法后，我再也不……"）③对比型（"同样100块，国产vs大牌差距有多大"）④反常识型（"其实你每天都在毁手机"）⑤人群标签型（"学生党闭眼入"）。',platform:'抖音',difficulty:'入门',tags:['标题','文案','流量'],url:'https://www.douyin.com/search/爆款标题怎么写&type=video'},
{id:'c57',stage:4,day:29,idx:1,title:'去重技巧：二创过审的核心方法',desc:'平台查重越来越严，二创必须去重。至少用3种组合：①镜像翻转画面 ②调整画面比例裁切 ③加自己的边框/字幕条 ④叠加半透明蒙版 ⑤变速1.05x微调 ⑥替换BGM ⑦插入自己的出镜解说。注意原素材不超过30%，否则仍然有风险。',platform:'B站',difficulty:'进阶',tags:['去重','二创','过审'],url:'https://search.bilibili.com/all?keyword=剪辑去重去水印教程&order=click'},
{id:'c58',stage:4,day:29,idx:2,title:'发布时间+文案+话题标签全攻略',desc:'发了视频没人看？不一定是剪得不好。优化三要素：①发布时间：工作日12-13点、18-19点、21-22点最佳 ②文案：前两行必须抓人（因为预览只显示两行）③话题标签：1个大的+2个中的+2个小的（比如#数码 #手机技巧 #iPhone #学生党 #好物推荐）。',platform:'抖音',difficulty:'入门',tags:['发布','运营','流量'],url:'https://www.douyin.com/search/视频发布时间文案技巧&type=video'},
{id:'c59',stage:4,day:30,idx:1,title:'阶段小结：从会剪到剪得好',desc:'这9天你学了：口播/Vlog/开箱/知识分享/影视解说各类视频的剪辑方法，拉片拆解爆款，B-roll拍摄，音效搭配，封面标题设计，去重发布技巧。现在你已经具备了独立创作优质内容的能力。最后一步：开始积累你的作品集！',platform:'B站',difficulty:'进阶',tags:['阶段总结','实战','里程碑'],url:'https://search.bilibili.com/all?keyword=新手剪辑成长历程&order=click'},
{id:'c60',stage:4,day:30,idx:2,title:'练习作业：模仿一条你最喜欢的视频，1:1复刻',desc:'选一条你最喜欢的爆款视频→下载→导入剪映→1:1复刻它的节奏、转场、字幕、音效。这是学习剪辑最快的方法，没有之一。做完后对比原版，看看差距在哪，进步就在这个对比里。',platform:'抖音',difficulty:'进阶',tags:['模仿','复刻','练习'],url:'https://www.douyin.com/search/剪辑模仿练习方法&type=video'},

// === 第5阶段：多看多练 + 积累作品 + 接单（Day 31+）===
{id:'c61',stage:5,day:31,idx:1,title:'每天必看的5个剪辑博主推荐（抖音版）',desc:'关注这5个抖音博主每天学一招：①"剪辑教程"（基础到进阶全覆盖）②"影视飓风"（专业级教程）③"剪映课堂"（官方技巧）④"小北剪辑"（新手友好）⑤"阿杰剪辑"（卡点/特效专精）。每天花10分钟刷一遍，比报班有效。',platform:'抖音',difficulty:'入门',tags:['博主推荐','学习资源','每天'],url:'https://www.douyin.com/search/剪辑教程博主推荐&type=video'},
{id:'c62',stage:5,day:31,idx:2,title:'B站必收藏的5个剪辑UP主',desc:'B站剪辑学习宝藏：①"影视飓风"（行业顶尖教程）②"大川剪辑"（剪映深度教学）③"特效小哥"（AE/PR进阶）④"剪辑思维"（剪辑理念和方法论）⑤"影视后期圈"（调色/特效）。建议从"大川剪辑"开始，最接地气。',platform:'B站',difficulty:'入门',tags:['UP主','学习资源','B站'],url:'https://search.bilibili.com/all?keyword=剪辑教程UP主推荐&order=click'},
{id:'c63',stage:5,day:32,idx:1,title:'如何找到自己的剪辑风格',desc:'别急着模仿所有人。先做10条视频，回看找到共同点：你擅长快节奏还是慢节奏？喜欢干净风还是花哨风？用文字多还是画面多？找到自己的舒适区，然后在这个方向上深耕。风格是"做"出来的，不是"想"出来的。',platform:'B站',difficulty:'进阶',tags:['风格','定位','个人'],url:'https://search.bilibili.com/all?keyword=如何找到剪辑风格&order=click'},
{id:'c64',stage:5,day:32,idx:2,title:'积累作品集：前10条视频怎么规划',desc:'不要随便发！前10条视频决定了别人对你的第一印象。建议：3条口播（展示你的观点）、3条教程/测评（展示你的专业度）、2条Vlog（展示你的生活）、2条创意剪辑（展示你的技术）。统一封面风格，让人一看到就知道是你。',platform:'B站',difficulty:'进阶',tags:['作品集','规划','个人品牌'],url:'https://search.bilibili.com/all?keyword=新手作品集规划&order=click'},
{id:'c65',stage:5,day:33,idx:1,title:'新手去哪里接剪辑单子',desc:'有能力就可以开始变现了。接单渠道：①闲鱼搜"剪辑接单"（门槛最低）②小红书发作品+接单帖 ③豆瓣剪辑小组 ④猪八戒网/一品威客 ⑤朋友圈告知你会剪辑。新手定价建议：短视频30-80元/条，先接几单积累案例和好评。',platform:'B站',difficulty:'进阶',tags:['接单','变现','副业'],url:'https://search.bilibili.com/all?keyword=剪辑接单新手&order=click'},
{id:'c66',stage:5,day:33,idx:2,title:'接单沟通技巧：怎么和甲方谈需求不踩坑',desc:'新手接单最容易翻车的地方：需求没对齐。必做3件事：①让甲方发2-3条他喜欢的参考视频 ②明确要改几次（建议不超过3次，超出加钱）③先收定金（30%-50%），交片付尾款。所有沟通留聊天记录，避免纠纷。',platform:'抖音',difficulty:'进阶',tags:['接单','沟通','甲方'],url:'https://www.douyin.com/search/剪辑接单沟通技巧&type=video'},
{id:'c67',stage:5,day:34,idx:1,title:'持续进步：每个月给自己定一个剪辑小目标',desc:'学无止境。月度目标示例：第1个月-能独立剪口播，第2个月-学会关键帧+蒙版，第3个月-能剪卡点+信息流，第4个月-学会调色+音效设计，第5个月-形成个人风格，第6个月-稳定接单。每个月完成一个小目标，半年后你就是高手。',platform:'B站',difficulty:'入门',tags:['目标','成长','规划'],url:'https://search.bilibili.com/all?keyword=剪辑学习规划路线&order=click'},
{id:'c68',stage:5,day:34,idx:2,title:'终极心法：剪辑的本质不是技术，是讲故事',desc:'技术可以速成，但讲故事的能力需要长期积累。每剪一条视频前问自己：我要讲一个什么故事？观众看完是什么感受？好的剪辑是让观众忘了剪辑的存在，只沉浸在内容里。当你开始用"导演思维"而不是"工具思维"来剪辑时，你就真正入门了。',platform:'B站',difficulty:'进阶',tags:['心法','讲故事','终极'],url:'https://search.bilibili.com/all?keyword=剪辑思维讲故事&order=click'},

{id:'c69',stage:5,day:35,idx:1,title:'调色进阶：模仿电影色调的LUT使用指南',desc:'剪映支持导入LUT（颜色查找表），一键套用电影级调色。推荐几个风格：青橙色调（适合城市/街拍）、日系胶片（适合Vlog）、复古棕调（适合美食）。导入方法：点"调节"→"LUT"→"导入"→选择LUT文件→强度调到60%。网上搜"免费LUT"有很多资源。',platform:'B站',difficulty:'进阶',tags:['调色','LUT','电影感'],url:'https://search.bilibili.com/all?keyword=LUT调色剪映教程&order=click'},
{id:'c70',stage:5,day:35,idx:2,title:'AE入门：什么时候该学更专业的软件',desc:'剪映能解决90%的需求，但遇到复杂特效还是得AE。什么时候该升级？①需要做复杂粒子特效（火花/烟雾/光效）②需要3D文字/跟踪 ③客户要求专业格式交付。AE学习路线：先B站搜"AE入门教程"→学图层/关键帧/蒙版（概念和剪映一样）→再学特效插件。',platform:'B站',difficulty:'进阶',tags:['AE','进阶','专业'],url:'https://search.bilibili.com/all?keyword=AE新手入门教程&order=click'},
{id:'c71',stage:5,day:36,idx:1,title:'PR入门：从剪映迁移到PR的过渡指南',desc:'PR是行业标准剪辑软件。好消息：剪映里学的所有概念在PR里都有对应（轨道、关键帧、蒙版、转场）。不同点：PR的界面更复杂但功能更强大，适合做长视频和精细剪辑。迁移技巧：先继续用剪映做日常视频，PR只用来处理剪映搞不定的项目，慢慢过渡。',platform:'B站',difficulty:'进阶',tags:['PR','过渡','专业'],url:'https://search.bilibili.com/all?keyword=PR新手入门教程&order=click'},
{id:'c72',stage:5,day:36,idx:2,title:'做一个属于自己的片头片尾模板',desc:'品牌感从统一的片头片尾开始。用剪映做一个3秒片头模板：你的名字/logo+一句slogan+统一BGM。以后每条视频直接套用，省时间又建立辨识度。片尾2秒：关注+点赞+下期预告，引导互动。',platform:'抖音',difficulty:'入门',tags:['片头','模板','品牌'],url:'https://www.douyin.com/search/片头片尾模板制作&type=video'},

const isToday=ds===todayStr;
const isWeekend=new Date(year,month,d).getDay()%6===0;
let dots='';items.forEach(c=>{const a=accs.find(x=>x.id===c.account);dots+='<span class="cal-dot" style="background:'+(a?a.color:'#ccc')+'" title="'+(a?a.name:'')+': '+U.esc(c.title)+'"></span>';});
dayItems.push('<div class="cal-cell'+(isToday?' today':'')+(isWeekend?' weekend':'')+'" onclick="App.openCalAdd(\''+ds+'\')"><span class="cal-day">'+d+'</span><div class="cal-dots">'+dots+'</div></div>');}
return '<div class="view"><div class="page-title">内容日历 \uD83D\uDCC5</div><div class="page-subtitle">'+monthLabel+' · 发布排期一目了然</div><div class="card cal-header-card"><div class="flex-between"><div style="font-size:13px;font-weight:600;">\uD83D\uDCC5 '+monthLabel+'</div><div><button class="btn btn-primary btn-sm" onclick="App.openCalAdd(\''+todayStr+'\')">+ 新增排期</button></div></div></div><div class="cal-grid"><div class="cal-weekday"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="cal-days">'+dayItems.join('')+'</div></div><div class="card mt-12"><div class="card-title">\uD83D\uDCCC 近期排期</div>'+cal.filter(c=>c.date>=todayStr).slice(0,10).map(c=>{const a=accs.find(x=>x.id===c.account);return'<div class="cal-item flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);"><div><span class="tag" style="background:'+(a?a.color+'20':'#eee')+';color:'+(a?a.color:'#666')+';">'+(a?a.emoji+' '+a.name:'')+'</span> <span style="font-size:13px;">'+U.esc(c.title)+'</span></div><span style="font-size:11px;color:var(--text-mute);">'+c.date+'</span></div>';}).join('')+'</div></div>';},

account(d,aid){const a=(d.accounts||[]).find(x=>x.id===aid);if(!a)return V.empty('账号不存在','');const reviews=(d.reviews||[]).filter(r=>r.account===aid);const cal=(d.calendar||[]).filter(c=>c.account===aid&&c.date>=new Date().toISOString().slice(0,10));const totalPlays=reviews.reduce((s,r)=>s+(r.plays||0),0);const totalLikes=reviews.reduce((s,r)=>s+(r.likes||0),0);
return '<div class="view"><div class="page-title">'+a.emoji+' '+a.name+'</div><div class="page-subtitle">'+a.desc+'</div><div class="card acc-info-card" style="border-left:4px solid '+a.color+';"><div style="display:flex;align-items:center;gap:12px;"><div style="font-size:40px;">'+a.icon+'</div><div><div style="font-weight:700;font-size:15px;">'+a.name+'</div><div style="font-size:12px;color:var(--text-sub);">'+a.platforms+' · 粉丝 '+a.fans+'</div></div></div></div><div class="stat-grid" style="margin-top:12px;"><div class="stat-card"><div class="stat-icon pink">\u25B6</div><div><div class="stat-val">'+(totalPlays/10000).toFixed(1)+'w</div><div class="stat-label">总播放</div></div></div><div class="stat-card"><div class="stat-icon purple">\u2764</div><div><div class="stat-val">'+(totalLikes/10000).toFixed(1)+'w</div><div class="stat-label">总点赞</div></div></div><div class="card-title mt-12">\uD83D\uDCCC 本周发布计划</div>'+cal.slice(0,5).map(c=>'<div class="cal-item flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);"><span style="font-size:13px;">'+U.esc(c.title)+'</span><span class="tag">'+c.date+'</span></div>').join('')+'<div class="card-title mt-12">\uD83D\uDCCA 内容数据复盘</div>'+reviews.slice(0,10).map(r=>'<div class="card history-item"><div class="history-head"><div class="history-title">'+U.esc(r.title)+'</div><div class="history-date">'+r.date+'</div></div><div class="history-metrics"><span class="hm">\u25B6 '+r.plays.toLocaleString()+'</span><span class="hm">\u2764 '+r.likes.toLocaleString()+'</span><span class="hm">完播 '+r.finishRate+'%</span></div></div>').join('')+'</div>';},

goal(d){const g=d.monthlyGoal;if(!g)return V.empty('暂无月度目标','');const totalKr=g.krs.reduce((s,k)=>s+k.target,0);const doneKr=g.krs.reduce((s,k)=>s+k.current,0);const pct=totalKr?Math.round(doneKr/totalKr*100):0;
return '<div class="view"><div class="page-title">月度目标 \uD83C\uDFAF</div><div class="page-subtitle">'+g.month+' · '+g.objective+'</div><div class="card" style="background:linear-gradient(135deg,#EDE4FF,#FCE4EC);border:none;margin-bottom:16px;"><div style="font-size:13px;color:var(--purple-500);font-weight:600;margin-bottom:6px;">\uD83C\uDF1F 本月OKR</div><div style="font-size:14px;color:var(--text);font-weight:600;margin-bottom:12px;">'+U.esc(g.objective)+'</div><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:linear-gradient(90deg,var(--purple-400),var(--pink-400));"></div></div><div class="progress-text"><span>总进度</span><span>'+pct+'%</span></div></div>'+g.krs.map((k,i)=>'<div class="card kr-card" style="border-left:4px solid '+(['#E53935','#43A047','#FB8C00'][i]||'#9333EA')+';"><div class="kr-title">KR'+(i+1)+'：'+U.esc(k.kr)+'</div><div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" style="width:'+Math.round(k.current/k.target*100)+'%"></div></div><div class="progress-text"><span>'+k.current+' / '+k.target+'</span><span>'+Math.round(k.current/k.target*100)+'%</span></div></div>').join('')+'<div class="card-title mt-12">\uD83D\uDCC6 每周里程碑</div>'+g.weeks.map(w=>'<div class="card" style="padding:10px 14px;margin-bottom:8px;"><div class="flex-between"><span style="font-weight:600;font-size:13px;">第'+w.wk+'周</span><span class="tag" style="background:'+(w.done?'#E8F5E9':'#FFF3E0')+';color:'+(w.done?'#2E7D32':'#E65100')+';">'+(w.done?'已完成':'进行中')+'</span></div><div style="font-size:12px;color:var(--text-sub);margin-top:4px;">'+U.esc(w.goal)+'</div></div>').join('')+'</div>';},

reviewScore(x){let s=50;if(x.finishRate>=50)s+=15;else if(x.finishRate>=35)s+=5;else s-=10;const lr=x.plays?x.likes/x.plays*100:0;if(lr>=5)s+=10;else if(lr>=3)s+=5;else s-=5;const cr=x.plays?x.comments/x.plays*100:0;if(cr>=0.5)s+=10;else if(cr>=0.3)s+=5;const sr=x.plays?x.saves/x.plays*100:0;if(sr>=2)s+=10;else if(sr>=1)s+=5;const shr=x.plays?x.shares/x.plays*100:0;if(shr>=1)s+=5;return Math.max(0,Math.min(100,s));},
empty(t,tip){return `<div class="empty-state"><svg viewBox="0 0 24 24" width="56" height="56" style="opacity:.4;"><path fill="#B5A8B8" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><p>${t}</p><div style="font-size:12px;margin-top:4px;">${tip}</div></div>`;}
};

const NAV=[
{key:'home',icon:'\uD83C\uDFE0',label:'\u9996\u9875'},{key:'plan',icon:'\u2705',label:'\u6bcf\u65e5\u8ba1\u5212'},{key:'calendar',icon:'\uD83D\uDCC5',label:'\u5185\u5bb9\u65e5\u5386'},
{key:'account_a1',icon:'\uD83D\uDCF1',label:'\u6570\u7801\u5f00\u7bb1'},{key:'account_a2',icon:'\uD83D\uDCAC',label:'\u5973\u6027\u6210\u957f'},
{key:'trends',icon:'\uD83D\uDD25',label:'\u70ed\u70b9\u7d20\u6750'},{key:'library',icon:'\uD83D\uDCD5',label:'\u7206\u6b3e\u9009\u9898'},{key:'ecommerce',icon:'\uD83D\uDE9A',label:'\u5e26\u8d27\u70ed\u70b9'},{key:'clip',icon:'\uD83C\uDFAC',label:'\u526a\u8f91\u5e72\u8d27'},{key:'review',icon:'\uD83D\uDCDD',label:'\u5185\u5bb9\u590d\u76d8'},
{key:'books',icon:'\uD83D\uDCDA',label:'\u6bcf\u65e5\u9605\u8bfb'},{key:'finance',icon:'\uD83D\uDCB0',label:'\u7406\u8d22\u77e5\u8bc6'},{key:'goal',icon:'\uD83C\uDFAF',label:'\u6708\u5ea6\u76ee\u6807'}
];

const App={data:null,view:'home',platform:'dy',trendsCat:'all',reviewAcct:'all',showReviewForm:true,
init(){this.data=DB.load();this.data=DB.checkReset(this.data);this.patchData();DB.save(this.data);this.renderNav();this.updateHeader();this.render();this.startClock();},
patchData(){const def=DB.default();if(!this.data.clipTips||!this.data.clipTips.length){this.data.clipTips=def.clipTips;}if(!this.data.trends||!this.data.trends.length){this.data.trends=def.trends;}if(!this.data.accounts||!this.data.accounts.length){this.data.accounts=def.accounts;}if(!this.data.calendar){this.data.calendar=def.calendar;}if(!this.data.monthlyGoal){this.data.monthlyGoal=def.monthlyGoal;}if(!this.data.ecommerce||!this.data.ecommerce.length){this.data.ecommerce=def.ecommerce;}if(!this.data.ecommerceExperiments){this.data.ecommerceExperiments=[];}},
renderNav(){document.getElementById('sidebarNav').innerHTML=NAV.map(n=>`<a class="nav-item ${this.view===n.key?'active':''}" data-view="${n.key}" onclick="App.nav('${n.key}')"><span style="font-size:18px;">${n.icon}</span><span>${n.label}</span></a>`).join('');},
nav(v){this.view=v;document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));this.render();if(window.innerWidth<=768)this.closeSidebar();document.getElementById('viewContainer').scrollTop=0;},
toggleSidebar(){const s=document.getElementById('sidebar');const o=document.getElementById('sidebarOverlay');s.classList.toggle('open');o.classList.toggle('show');},
closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show');},
updateHeader(){document.getElementById('todayLabel').textContent=U.dateLabel();document.getElementById('modeLabel').textContent=this.data.mode==='daily'?'\u6bcf\u65e5\u91cd\u7f6e':'\u7d2f\u79ef\u8bb0\u5f55';},
startClock(){const upd=()=>{const d=new Date();const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const el=document.getElementById('liveTime');if(el)el.textContent=t;};upd();setInterval(upd,1000);},
render(){const c=document.getElementById('viewContainer');const d=this.data;const v=this.view;c.innerHTML=v==='home'?V.home(d):v==='plan'?V.plan(d):v==='calendar'?V.calendar(d):v==='books'?V.books(d):v==='trends'?V.trends(d):v==='library'?V.library(d):v==='ecommerce'?V.ecommerce(d):v==='review'?V.review(d):v==='clip'?V.clip(d):v==='finance'?V.finance(d):v==='goal'?V.goal(d):v==='account_a1'?V.account(d,'a1'):v==='account_a2'?V.account(d,'a2'):'';},
toggleCheckin(k){this.data.checkin[k]=!this.data.checkin[k];DB.save(this.data);this.render();},
addTask(q){const i=document.getElementById('ai-'+q);const t=i.value.trim();if(!t)return;this.data.tasks[q].push({id:U.uid(),text:t,done:false});DB.save(this.data);this.render();U.toast('\u5df2\u65b0\u589e');},
delTask(q,id){this.data.tasks[q]=this.data.tasks[q].filter(t=>t.id!==id);DB.save(this.data);this.render();U.toast('\u5df2\u5220\u9664');},
toggleTask(q,id){const t=this.data.tasks[q].find(x=>x.id===id);if(t){t.done=!t.done;DB.save(this.data);this.render();if(t.done)U.toast('\u6253\u5361\u5b8c\u6210 \u2705');}},
toggleQ(q){const b=document.getElementById('qb-'+q);b.style.display=b.style.display==='none'?'':'none';},
switchTrendsP(p){this.platform=p;this.render();},switchP(p){this.platform=p;this.render();},setTrendsCat(c){this.trendsCat=c;this.render();},setReviewAcct(a){this.reviewAcct=a;this.render();},setEcLevel(l){this.ecLevel=l;this.render();},
searchLib(kw){kw=kw.trim().toLowerCase();document.querySelectorAll('.lib-card').forEach(card=>card.style.display=card.dataset.kw.includes(kw)?'':'none');},
openLibLink(url){if(!url){U.toast('\u65E0\u6548\u94FE\u63A5');return;}const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100);},
copyLink(url,btn){if(!url){U.toast('\u65E0\u6548\u94FE\u63A5');return;}if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>{U.toast('\u94FE\u63A5\u5DF2\u590D\u5236');if(btn)btn.innerHTML='\u2705 \u5DF2\u590D\u5236';setTimeout(()=>{if(btn)btn.innerHTML='\uD83D\uDCCB \u590D\u5236\u94FE\u63A5';},2000);});}else{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);U.toast('\u94FE\u63A5\u5DF2\u590D\u5236');}},
openAddLib(){const h='<div class="form-row"><label class="label">\u7C98\u8D34\u89C6\u9891\u94FE\u63A5\uFF08\u6296\u97F3/\u5C0F\u7EA2\u4E66/B\u7AD9/\u5F97\u7269\uFF09</label><div class="link-input-wrap"><input class="input" id="nl-u" placeholder="https://..." oninput="App.detectAddLink()" style="padding-right:90px;"><span id="nl-platform-badge" class="link-platform-badge"></span></div></div><div class="form-row"><label class="label">\u6807\u9898</label><input class="input" id="nl-t" placeholder="\u7206\u6B3E\u89C6\u9891\u6807\u9898"></div><div class="form-row"><label class="label">\u5173\u952E\u8BCD</label><input class="input" id="nl-k" placeholder="\u7528\u9017\u53F7\u5206\u9694"></div><div class="form-row"><label class="label">\u5E73\u53F0</label><select class="select" id="nl-p"><option>\u6296\u97F3</option><option>B\u7AD9</option><option>\u5C0F\u7EA2\u4E66</option><option>\u5F97\u7269</option></select></div><button class="btn btn-primary btn-full" onclick="App.subLib()">\u4FDD\u5B58</button>';this.modal('\u65B0\u589E\u9009\u9898',h);},
detectAddLink(){const url=document.getElementById('nl-u').value.trim();const plat=U.detectPlatform(url);const badge=document.getElementById('nl-platform-badge');if(plat.key&&plat.key!=='other'){badge.innerHTML='<span style="background:'+plat.color+';color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;">'+plat.icon+' '+plat.name+'</span>';badge.style.display='inline-block';document.getElementById('nl-p').value=plat.name;}else{badge.innerHTML='';badge.style.display='none';}},subLib(){const u=document.getElementById('nl-u').value.trim()||'#';const t=document.getElementById('nl-t').value.trim();const k=document.getElementById('nl-k').value.trim();const p=document.getElementById('nl-p').value;const plat=U.detectPlatform(u);const platformName=plat.key&&plat.key!=='other'?plat.name:p;if(!t&&!u){U.toast('\u8BF7\u586B\u5199\u6807\u9898\u6216\u94FE\u63A5');return;}const title=t||plat.name+'\u7206\u6B3E\u7D20\u6750';const kw=k?k.split(/[\uff0c,\u3001\s]/).filter(Boolean):['\u7206\u6B3E'];this.data.library.unshift({id:U.uid(),title:title,keywords:kw,url:u,platform:platformName,plays:'--'});DB.save(this.data);this.closeModal();this.render();U.toast('\u5DF2\u65B0\u589E');},
startExperiment(ecId){const ec=(this.data.ecommerce||[]).find(e=>e.id===ecId);if(!ec)return;const exps=this.data.ecommerceExperiments||[];if(!this.data.ecommerceExperiments)this.data.ecommerceExperiments=[];const existing=this.data.ecommerceExperiments.find(x=>x.ecId===ecId&&x.status==='\u8FDB\u884C\u4E2D');if(existing){U.toast('\u8FD9\u4E2A\u65B9\u5411\u5DF2\u7ECF\u5728\u5B9E\u9A8C\u4E2D\u4E86~');return;}const t=new Date().toISOString().slice(0,10);this.data.ecommerceExperiments.unshift({id:U.uid(),ecId:ecId,title:ec.title,date:t,status:'\u8FDB\u884C\u4E2D',plays:0,likes:0,conversions:0,notes:''});this.data.tasks.q1.push({id:U.uid(),text:'\uD83D\uDE80 \u5E26\u8D27\u5B9E\u9A8C\uFF1A'+ec.title,done:false});DB.save(this.data);this.render();U.toast('\uD83D\uDE80 \u5B9E\u9A8C\u5DF2\u542F\u52A8\uFF01\u5DF2\u6DFB\u52A0\u5230\u4ECA\u65E5\u8BA1\u5212');},
updateExp(id,field,val){const exp=(this.data.ecommerceExperiments||[]).find(x=>x.id===id);if(!exp)return;exp[field]=val;DB.save(this.data);this.render();U.toast('\u5DF2\u66F4\u65B0');},
deleteExp(id){if(!confirm('\u786E\u5B9A\u5220\u9664\u8FD9\u6761\u5B9E\u9A8C\u8BB0\u5F55\u5417\uFF1F'))return;this.data.ecommerceExperiments=(this.data.ecommerceExperiments||[]).filter(x=>x.id!==id);DB.save(this.data);this.render();U.toast('\u5DF2\u5220\u9664');},
};
document.addEventListener('DOMContentLoaded',()=>App.init());




</script>
